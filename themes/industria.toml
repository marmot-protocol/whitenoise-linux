# Sidecar calls this Art Deco: daylight eggshell, bronze ink and champagne gold.
# https://github.com/dmnyc/sidecar/blob/3aaebf9dc7beb9924c6e1f9bc060cecbc1be6f8f/themes/industria.css
# Shared component roles: styles.css at the same pinned revision.
name = "Art Deco"

[colors]
bg = "#f0ead6ff"
bg-2 = "#e8e0d0ff"
# Velvet gradient stops; native surfaces use a single color.
panel = "#e6dcc8ff"
panel-2 = "#ded4c0ff"
rail = "#e8e0d0ff"
elevated = "#e6dcc8ff"
plate = "#e6dcc8ff"
status-bar = "#e6dcc8ff"
banner = "#ded4c0ff"
canvas-top = "#f0ead6ff"
text-hi = "#2a2a2aff"
text-mid = "#4a4a4aff"
text-lo = "#6a6a6aff"
text-vlo = "#8a8a8aff"
field = "#e8e0d0ff"
field-hover = "#e8e0d0ff"
field-border = "#8b735533"
hover = "#c5a0591f"
card-border = "#8b735533"
elevated-border = "#8b735559"
border-2 = "#8b735533"
divider = "#8b735533"
avatar-ring = "#8b735559"
card-well = "#e8e0d099"
plate-inset = "#e8e0d066"
code-plate = "#8b73551f"
danger = "#9a3a2eff"
danger-soft = "#9a3a2e1f"
danger-border = "#9a3a2e73"
warning = "#a8521fff"
warning-soft = "#a8521f1a"
warning-border = "#a8521f4d"
overlay = "#05000ca8"
overlay-strong = "#080214b8"
shadow-soft = "#00000026"
shadow-card = "#0000001f"
shadow-popover = "#00000099"
shadow-float = "#00000073"
top-glint = "#ffffff66"
bevel-hi = "#ffffff66"
bevel-lo = "#00000000"
# Deep bronze is the source UI ink; pale metallic gold is fill-only upstream.
accent-base = [
    "#6b4e1cff",
    "#8a4a18ff",
    "#6e4e14ff",
    "#7a5a18ff",
    "#735719ff",
]

[style]
backdrop = "image:sunburst"
font = "Manrope"
font-title = "Josefin Sans"
bevel = false
hard-shadow = false
outline-surfaces = false
bracket-labels = false
motion-fast = false
focus-glow = true
r-scale = 1.0
border-w = 1.0
glow-r = 3.0
shadow-y = 6.0
hover-dur = 150.0
transition-dur = 150.0
