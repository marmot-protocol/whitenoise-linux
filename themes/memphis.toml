# Late-90s desktop: silver dialog faces, white wells, navy title bars,
# and square two-pixel bevels.
name = "Memphis"
accent-name-1 = "Title-bar navy"
accent-name-2 = "Desktop teal"
accent-name-3 = "Brick"
accent-name-4 = "Solitaire green"
accent-name-5 = "Eggplant"

[colors]
bg = "#c0c0c0ff"
panel = "#c0c0c0ff"
elevated = "#c0c0c0ff"
status-bar = "#c0c0c0ff"
field = "#ffffffff"
field-hover = "#ffffffff"
field-border = "#808080ff"
card-border = "#808080ff"
elevated-border = "#404040ff"
divider = "#808080ff"
plate = "#ffffffff"
card-well = "#ffffffff"
code-plate = "#ffffffff"
hover = "#dfdfdfff"
text-hi = "#000000ff"
text-mid = "#202020ff"
text-lo = "#404040ff"
text-vlo = "#606060ff"

bevel-hi = "#ffffffff"
bevel-lo = "#808080ff"
top-glint = "#ffffffff"
avatar-ring = "#808080ff"
overlay = "#00000040"
shadow-card = "#000000ff"
danger = "#900000ff"
warning = "#604400ff"
accent-base = [
    "#000080ff",
    "#005555ff",
    "#800000ff",
    "#005400ff",
    "#800080ff",
]

[style]
noir = false
saturation = 1
avatar-erase = false
font-scale = 1
chalk-drawn = false
bevel = true
outline-surfaces = true
hard-shadow = true
motion-fast = true
r-scale = 0.0
border-w = 2.0
bubble-r = 0.0
shadow-y = 1.0
hover-dur = 60
transition-dur = 80
