# Sidecar: black-and-white film, silver UI ink and red only for destructive actions.
# https://github.com/dmnyc/sidecar/blob/3aaebf9dc7beb9924c6e1f9bc060cecbc1be6f8f/themes/film-noir.css
# Shared component roles: styles.css at the same pinned revision.
name = "Film Noir"

[colors]
bg = "#0a0a0aff"
bg-2 = "#111111ff"
# Velvet gradient stops; native surfaces use a single color.
panel = "#141414ff"
panel-2 = "#1e1e1eff"
rail = "#111111ff"
elevated = "#141414ff"
plate = "#141414ff"
status-bar = "#141414ff"
banner = "#1e1e1eff"
canvas-top = "#0a0a0aff"
text-hi = "#e0e0e0ff"
text-mid = "#c0c0c0ff"
text-lo = "#a0a0a0ff"
text-vlo = "#7c7c7cff"
# The theme's input/textarea rules override its editor gradient with bg-2.
field = "#111111ff"
field-hover = "#111111ff"
field-border = "#c0c0c01f"
hover = "#c0c0c01f"
card-border = "#c0c0c01f"
elevated-border = "#c0c0c03d"
border-2 = "#c0c0c01f"
divider = "#c0c0c01f"
avatar-ring = "#c0c0c03d"
card-well = "#11111199"
plate-inset = "#11111166"
code-plate = "#c0c0c01f"
# Native danger covers data-loss actions: use noir-danger, not grayscale error ink.
# The native danger wash has no scoped destructive equivalent; reuse the shared opacity.
danger = "#ef5b60ff"
danger-soft = "#ef5b601f"
danger-border = "#ef5b6073"
warning = "#d0d0d0ff"
warning-soft = "#d0d0d01a"
warning-border = "#d0d0d04d"
overlay = "#000000a8"
overlay-strong = "#000000b8"
shadow-soft = "#0000008c"
shadow-card = "#00000073"
shadow-popover = "#00000099"
shadow-float = "#00000073"
top-glint = "#ffffff08"
bevel-hi = "#ffffff08"
bevel-lo = "#00000000"
accent-base = [
    "#c0c0c0ff",
    "#a0a0a0ff",
    "#b8b8b8ff",
    "#d4d4d4ff",
    "#e0e0e0ff",
]

[style]
backdrop = "image:film"
font = "Manrope"
font-title = "Noto Serif Display Condensed"
bevel = false
hard-shadow = false
outline-surfaces = false
focus-glow = true
r-scale = 1.0
border-w = 1.0
glow-r = 3.0
shadow-y = 6.0
hover-dur = 150.0
transition-dur = 150.0
