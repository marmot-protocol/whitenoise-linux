name: WN real build on Arch

on:
  push:
    branches: [wn-build-server-smoke-20261023]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64, wn-build-server, arch]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build White Noise
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = runner
          test "$(cat /sys/fs/cgroup/system.slice/github-runner.service/cpu.max)" = '1280000 100000'
          scripts/build.sh
      - name: Run the built application headless
        shell: bash
        run: |
          set -euo pipefail
          SDL_VIDEODRIVER=dummy WN_SHOT=1 WN_VAULT_PW=ci-smoke ./build/app "$(mktemp -d)"
