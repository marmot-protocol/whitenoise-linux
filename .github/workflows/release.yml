# Release: Linux x86_64 AppImage/Flatpak/Orchard plus the cross.yml packages
# (Linux ARM64 and Windows built on Linux, macOS built on a Mac).
#
# Both packages install the same tree, via scripts/install-tree.sh:
#   * the binary at <prefix>/bin, its helper programs at
#     <prefix>/lib/whitenoise-linux, and the runtime data the app reads
#     from disk (the emoji sets, the emoji picker catalog, the fonts) at
#     <prefix>/share/whitenoise-linux. `res_dir` and `helper_path` in
#     app/paths.odin resolve those relative to the binary, so the layout
#     is a contract with them.
#   * Noto Sans CJK is deliberately NOT bundled: the .ttc is tens of
#     megabytes, so Japanese falls back to the host's system copy.
#
# AppImage: linuxdeploy copies the binary's shared-library dependencies
# into the AppDir (SDL3, libmpv and its codec deps, poppler, cairo,
# libarchive). Flatpak: packaging/flatpak/*.yml builds those libraries as
# modules on the GNOME 50 runtime (freedesktop 25.08 base).
name: Release

on:
  # A manual run builds and smokes unsigned Flatpak/Orchard and Arch artifacts.
  # Even when dispatched against a tag, it cannot enter publishing jobs.
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/ci-container.sh
      - packaging/ci/**
      - packaging/flatpak/**
  push:
    # Keep the tokenless Flatpak module cache warm on the default branch.
    branches: [master]
    tags: ["v*"]

env:
  CARGO_BUILD_JOBS: "6"
  WN_BUILD_JOBS: "6"
  CMAKE_BUILD_PARALLEL_LEVEL: "6"
  ODIN_VERSION: dev-2026-09
  SDL_VERSION: "3.4.14"
  FLATPAK_ID: dev.ipf.whitenoise
  # The AppImage tooling, pinned by tag and sha256 like everything else
  # this build fetches. Upstream's "continuous" release is mutable, so
  # these use its dated tags instead.
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  # Lets the linuxdeploy / appimagetool AppImages run on a runner without
  # FUSE, by self-extracting instead of mounting.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  appimage:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: AppImage (x86_64)
    runs-on: [self-hosted, Linux, X64, wn-build-server, arch, wn-cache-1]
    defaults:
      run:
        shell: bash scripts/ci-container.sh run {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start native build container
        shell: bash
        run: bash scripts/ci-container.sh start native

      - name: Check release version
        run: bash scripts/version.sh "$GITHUB_REF_NAME"

      - name: Remove stale package outputs
        run: |
          rm -rf AppDir
          rm -f WhiteNoise-*.AppImage WhiteNoise-*.AppImage.zsync build/wn-appimage-update

      - name: Build
        env:
          WN_METRICS_WRITE_TOKEN: ${{ secrets.WN_METRICS_WRITE_TOKEN }}
          WN_AUDIT_WRITE_TOKEN: ${{ secrets.WN_AUDIT_WRITE_TOKEN }}
        run: scripts/build.sh

      - name: Build AppImage updater
        run: bash scripts/build-appimage-updater.sh

      - name: Assemble AppDir
        env:
          WN_PACKAGE_APPIMAGE: "1"
        run: |
          rm -rf AppDir
          scripts/install-tree.sh AppDir/usr whitenoise

      - name: Fetch AppImage tooling
        run: |
          set -euo pipefail
          wget -q -O linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage"
          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          echo "$LINUXDEPLOY_SHA256  linuxdeploy" | sha256sum -c -
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x linuxdeploy appimagetool

      - name: Exercise signed AppImage upgrades
        run: bun tests/appimage-update-smoke.ts ./appimagetool ./build/wn-appimage-update

      - name: Build AppImage
        env:
          WN_APPIMAGE_SIGNING_KEY: ${{ secrets.WN_APPIMAGE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # SDL3 lives outside the default search path, so point linuxdeploy
          # at it or it bundles everything except the one library that is
          # not installed system-wide.
          export LD_LIBRARY_PATH="/usr/local/sdl3/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # --executable would copy each helper into usr/bin; --deploy-deps-only
          # bundles their libraries and points their rpath at usr/lib in place.
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/whitenoise \
            --deploy-deps-only AppDir/usr/lib/whitenoise-linux \
            --desktop-file AppDir/usr/share/applications/whitenoise.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/whitenoise.png
          out="WhiteNoise-${GITHUB_REF_NAME}-x86_64.AppImage"
          bash scripts/sign-appimage.sh ./appimagetool AppDir "$out"
          echo "APPIMAGE_NAME=$out" >> "$GITHUB_ENV"

      # A smoke test of the packaged artifact, not of the app: SDL's dummy
      # video driver lets it boot with no display, and WN_SHOT exits after a
      # few frames. Catches a missing bundled library or a res_dir that no
      # longer finds its data.
      - name: Run the AppImage headless
        run: |
          set -euo pipefail
          chmod +x "$APPIMAGE_NAME"
          SDL_VIDEODRIVER=dummy WN_SHOT=1 WN_VAULT_PW=ci-smoke \
            ./"$APPIMAGE_NAME" "$(mktemp -d)"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            ${{ env.APPIMAGE_NAME }}
            ${{ env.APPIMAGE_NAME }}.zsync
          if-no-files-found: error

      - name: Remove generated observability credentials
        if: always()
        run: rm -f build/observability-tokens.toml

      - name: Stop build container
        if: always()
        shell: bash
        run: bash scripts/ci-container.sh stop

  orchard-publisher:
    name: Orchard publisher (x86_64)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-24.04"' || '["self-hosted","Linux","X64","wn-build-server","arch","wn-cache-1"]') }}
    defaults:
      run:
        shell: bash scripts/ci-container.sh run {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start native build container
        shell: bash
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          bash scripts/ci-container.sh start native

      - name: Build pinned publisher only
        run: |
          rm -f build/orchard-publish
          scripts/build-orchard.sh

      - uses: actions/upload-artifact@v4
        with:
          name: orchard-publisher
          path: build/orchard-publish
          if-no-files-found: error

      - name: Remove generated observability credentials
        if: always()
        run: rm -f build/observability-tokens.toml

      - name: Stop build container
        if: always()
        shell: bash
        run: bash scripts/ci-container.sh stop

  flatpak:
    name: Flatpak (x86_64)
    needs: orchard-publisher
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-24.04"' || '["self-hosted","Linux","X64","wn-build-server","arch","wn-cache-2"]') }}
    defaults:
      run:
        shell: bash scripts/ci-container.sh run {0}
    env:
      # Tagged module state contains the token-bearing final app. Never reuse
      # it for master/dispatch, and delete it before the container stops.
      FLATPAK_STATE_DIR: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'build/flatpak-tag-state' || 'build/flatpak-state' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start Flatpak build container
        shell: bash
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          bash scripts/ci-container.sh start flatpak

      - name: Check release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: bash scripts/version.sh "$GITHUB_REF_NAME"

      - name: Prepare fresh outputs and persistent dependency cache
        run: |
          set -euo pipefail
          # PR refs and branch names can contain '/', unlike release tags.
          echo "WN_FLATPAK_BUNDLE=WhiteNoise-${GITHUB_REF_NAME//\//-}-x86_64.flatpak" >> "$GITHUB_ENV"
          rm -rf build/flatpak build/flatpak-repo build/orchard-release build/flatpak-tag-state .flatpak-cache
          rm -f WhiteNoise-*.flatpak build/orchard-publish
          mkdir -p .flatpak-cache
          if [ -d build/flatpak-deps ]; then
            cp -a build/flatpak-deps/. .flatpak-cache/
          fi
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      # Preserve the action's builder flags, SDK dependency installation and
      # bundle runtime origin, without running a JavaScript action on the host.
      - name: Build Flatpak and bundle
        env:
          WN_METRICS_WRITE_TOKEN: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && secrets.WN_METRICS_WRITE_TOKEN || '' }}
          WN_AUDIT_WRITE_TOKEN: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && secrets.WN_AUDIT_WRITE_TOKEN || '' }}
        run: |
          set -euo pipefail
          # The SDK sandbox does not inherit the outer container's build limits.
          # Keep this resolved manifest beside the original for relative sources.
          flatpak-builder --show-manifest "packaging/flatpak/$FLATPAK_ID.yml" \
            | jq '."build-options".env += {"CARGO_BUILD_JOBS":"6","WN_BUILD_JOBS":"6","CMAKE_BUILD_PARALLEL_LEVEL":"6"}' \
            > packaging/flatpak/ci-manifest.json
          args=()
          if [[ "$FLATPAK_STATE_DIR" == build/flatpak-state ]]; then args+=(--ccache); fi
          xvfb-run --auto-servernum flatpak-builder \
            --user --install-deps-from=flathub --repo=build/flatpak-repo \
            --disable-rofiles-fuse --force-clean --keep-build-dirs --jobs=6 \
            --default-branch=master --arch=x86_64 --subject="Built from $GITHUB_SHA" \
            --state-dir="$FLATPAK_STATE_DIR" "${args[@]}" \
            build/flatpak packaging/flatpak/ci-manifest.json
          flatpak build-bundle build/flatpak-repo \
            "$WN_FLATPAK_BUNDLE" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            --arch=x86_64 "$FLATPAK_ID" master

      # The manifest copies .flatpak-cache into the app module before building;
      # its CARGO_HOME is cargo/, and native targets live in build/cargo/native.
      # Keep completed dependencies even if a later app compile fails.
      - name: Collect Flatpak dependency outputs
        if: always()
        run: |
          set -euo pipefail
          # Only dependencies cross the tagged/tokenless state boundary.
          if [ -d "$FLATPAK_STATE_DIR/build" ]; then
            find "$FLATPAK_STATE_DIR/build" -name observability-tokens.toml -delete
          fi
          source="$FLATPAK_STATE_DIR/build/whitenoise-linux"
          if [ -d "$source/build/cargo/native" ]; then
            mkdir -p .flatpak-cache/build/cargo
            cp -a "$source/build/cargo/native" .flatpak-cache/build/cargo/
          fi
          for state in registry git; do
            if [ -d "$source/cargo/$state" ]; then
              mkdir -p .flatpak-cache/cargo
              cp -a "$source/cargo/$state" .flatpak-cache/cargo/
            fi
          done
          if [ -f "$source/build/fbx/ufbx.stamp" ]; then
            mkdir -p .flatpak-cache/build/fbx
            cp -a "$source/build/fbx/ufbx.o" "$source/build/fbx/ufbx.stamp" .flatpak-cache/build/fbx/
          fi
          if [ -d .flatpak-cache ]; then
            mkdir -p build/flatpak-deps
            cp -a .flatpak-cache/. build/flatpak-deps/
          fi

      # Same smoke test as the AppImage: install the bundle and boot it
      # against SDL's dummy driver.
      - name: Run the Flatpak headless
        run: |
          set -euo pipefail
          flatpak install --user -y --noninteractive \
            "$WN_FLATPAK_BUNDLE"
          flatpak run --user --env=SDL_VIDEODRIVER=dummy --env=WN_SHOT=1 \
            --env=WN_VAULT_PW=ci-smoke "$FLATPAK_ID" "$(mktemp -d)"

      - uses: actions/download-artifact@v4
        with:
          name: orchard-publisher
          path: build

      - name: Prepare unsigned Orchard components
        run: |
          chmod +x build/orchard-publish
          args=()
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then args+=("$GITHUB_REF_NAME"); fi
          scripts/orchard-package.sh build/flatpak build/orchard-release "${args[@]}"

      # Install the archived bytes, not the preparer's internal layout. Remove
      # only the app already tested above so Flatpak cannot reuse that install;
      # leave its GNOME 50 runtime available for the OCI installation.
      - name: Install and run the Orchard archive headless
        run: |
          set -euo pipefail
          version="$(flatpak --version)"
          version="${version##* }"
          IFS=. read -r major minor patch <<< "$version"
          if (( major < 1 || (major == 1 && minor < 18) )); then
            echo "::error::OCI installation requires Flatpak 1.18+, found $version"
            exit 1
          fi
          layout="$(mktemp -d)"
          trap 'rm -rf "$layout"' EXIT
          tar -xzf build/orchard-release/dev.ipf.whitenoise-linux-x86_64.oci.tgz -C "$layout"
          flatpak uninstall --user -y --noninteractive "$FLATPAK_ID"
          flatpak install --user -y --noninteractive --no-deps "oci:$layout"
          test "$(flatpak info --user --show-ref "$FLATPAK_ID//stable")" = "app/$FLATPAK_ID/x86_64/stable"
          flatpak run --user --env=SDL_VIDEODRIVER=dummy --env=WN_SHOT=1 \
            --env=WN_VAULT_PW=ci-smoke "$FLATPAK_ID//stable" "$(mktemp -d)"

      - uses: actions/upload-artifact@v4
        with:
          name: orchard
          path: build/orchard-release/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: ${{ env.WN_FLATPAK_BUNDLE }}
          if-no-files-found: error

      - name: Remove generated credentials and tagged module outputs
        if: always()
        run: |
          set -euo pipefail
          rm -f build/observability-tokens.toml packaging/flatpak/ci-manifest.json
          if [ -d "$FLATPAK_STATE_DIR/build" ]; then
            find "$FLATPAK_STATE_DIR/build" -name observability-tokens.toml -delete
          fi
          rm -rf build/flatpak-tag-state
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            rm -rf build/flatpak build/flatpak-repo build/orchard-release
          fi

      - name: Stop build container
        if: always()
        shell: bash
        run: bash scripts/ci-container.sh stop

  cross:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/cross.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  # The tarball the AUR's whitenoise-linux-bin installs, built on Arch
  # against Arch's libraries from the same metadata as whitenoise-linux-git.
  archlinux:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    name: Arch Linux (x86_64)
    runs-on: [self-hosted, Linux, X64, wn-build-server, arch, wn-cache-1]
    defaults:
      run:
        shell: bash scripts/ci-container.sh run {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start Arch build container
        shell: bash
        run: bash scripts/ci-container.sh start arch

      - name: Install git and remove stale package outputs
        run: |
          pacman -Syu --noconfirm --needed git
          rm -rf dist build/arch

      - name: Check release version
        if: github.event_name == 'push'
        run: bash scripts/version.sh "$GITHUB_REF_NAME"

      - name: Install build dependencies
        run: |
          source packaging/arch/whitenoise-linux-git/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"

      # The PKGBUILD's pinned release, checked against its sha256 there.
      - name: Install Odin
        run: |
          source packaging/arch/whitenoise-linux-git/PKGBUILD
          if [ "$_odin" != "$ODIN_VERSION" ]; then
            echo "PKGBUILD pins Odin $_odin, this workflow $ODIN_VERSION" >&2
            exit 1
          fi
          curl -sSfL -o /tmp/odin.tar.gz "${source[1]}"
          echo "${sha256sums[1]}  /tmp/odin.tar.gz" | sha256sum -c -
          mkdir -p /opt/odin
          tar -xzf /tmp/odin.tar.gz -C /opt/odin --strip-components=1
          echo /opt/odin >> "$GITHUB_PATH"

      - name: Build
        env:
          WN_RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || '' }}
          WN_METRICS_WRITE_TOKEN: ${{ github.event_name == 'push' && secrets.WN_METRICS_WRITE_TOKEN || '' }}
          WN_AUDIT_WRITE_TOKEN: ${{ github.event_name == 'push' && secrets.WN_AUDIT_WRITE_TOKEN || '' }}
        run: scripts/arch-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: archlinux
          path: dist/*-archlinux-x86_64.tar.zst
          if-no-files-found: error

      - name: Remove generated observability credentials
        if: always()
        run: rm -f build/observability-tokens.toml

      - name: Stop build container
        if: always()
        shell: bash
        run: bash scripts/ci-container.sh stop

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Publish release
    needs: [appimage, flatpak, cross, archlinux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Smoke screenshots and the internal publisher are CI artifacts, not
      # release files. Keep both out of checksums and the public release.
      - name: Drop CI evidence
        run: rm -f dist/*.png dist/orchard-publish

      # One checksum file over everything the release ships, so a
      # download can be verified without trusting the release page alone.
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # scripts/release.sh writes the reviewed notes as the tag's message:
      # its first line is the release title, the rest the body. A tag
      # without notes (made by hand) falls back to GitHub's generated ones.
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Read the release notes from the tag
        id: notes
        run: |
          git -C src fetch -q --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          echo "name=$(git -C src tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
          git -C src tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.zsync
            dist/*.flatpak
            dist/*.asset.json
            dist/*.manifest.json
            dist/[0-9a-f][0-9a-f][0-9a-f][0-9a-f]*
            dist/*.oci.tgz
            dist/*.tar.gz
            dist/*.tar.zst
            dist/*.zip
            dist/*-Setup.exe
            dist/*.nupkg
            dist/*.win.json
            dist/appcast-*.xml
            dist/RELEASES
            dist/SHA256SUMS.txt
          name: ${{ steps.notes.outputs.name || github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          prerelease: false
          fail_on_unmatched_files: true

  # Point the AUR at the release just published: render whitenoise-linux-bin
  # and the from-source whitenoise-linux for this tag, install the former
  # from the release asset in a clean container and boot it, check every
  # source of the latter, then push both and whitenoise-linux-git. The push
  # is skipped until the repository has an AUR_SSH_PRIVATE_KEY secret.
  aur:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: AUR packages
    needs: [archlinux, publish]
    runs-on: [self-hosted, Linux, X64, wn-build-server, arch, wn-cache-1]
    defaults:
      run:
        shell: bash scripts/ci-container.sh run {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start Arch build container
        shell: bash
        run: bash scripts/ci-container.sh start arch

      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git openssh namcap
          rm -rf dist build/aur build/aur-git

      - uses: actions/download-artifact@v4
        with:
          name: archlinux
          path: dist

      # makepkg refuses to run as root.
      - name: Render the packages
        run: |
          scripts/aur-bin.sh "$GITHUB_REF_NAME" "dist/WhiteNoise-$GITHUB_REF_NAME-archlinux-x86_64.tar.zst" build/aur
          install -D -m 0644 packaging/arch/whitenoise-linux-git/PKGBUILD build/aur/whitenoise-linux-git/PKGBUILD
          useradd -m builder
          chown -R builder build/aur
          su builder -c "scripts/aur-source.sh '$GITHUB_REF_NAME' build/aur"
          for pkg in whitenoise-linux-bin whitenoise-linux-git; do
            su builder -c "cd build/aur/$pkg && makepkg --printsrcinfo > .SRCINFO"
          done

      # makepkg downloads the tarball from the release, which proves the
      # published URL and checksum. --nodeps leaves the depends to pacman -U,
      # which pulls them from the repositories, and the headless boot
      # catches one the list is missing.
      - name: Install and boot whitenoise-linux-bin
        run: |
          su builder -c 'cd build/aur/whitenoise-linux-bin && makepkg --nodeps'
          pacman -U --noconfirm build/aur/whitenoise-linux-bin/whitenoise-linux-bin-*.pkg.tar.zst
          namcap build/aur/whitenoise-linux-bin/PKGBUILD build/aur/whitenoise-linux-bin/whitenoise-linux-bin-*.pkg.tar.zst
          data="$(mktemp -d)"
          (cd "$data" && SDL_VIDEODRIVER=dummy WN_SHOT=1 WN_VAULT_PW=ci-smoke whitenoise "$data")

      # Downloads every pinned source the from-source package lists and
      # checks its digest; the archlinux job already built the same inputs.
      - name: Verify whitenoise-linux sources
        run: su builder -c 'cd build/aur/whitenoise-linux && makepkg --verifysource --nodeps'

      - name: Check for the AUR key
        id: key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      # The host key is the ED25519 one https://aur.archlinux.org publishes
      # (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
      - name: Push to the AUR
        if: steps.key.outputs.present == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          chmod 0600 "$ssh_dir/key"
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          for pkg in whitenoise-linux whitenoise-linux-bin whitenoise-linux-git; do
            repo="build/aur-git/$pkg"
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$repo"
            cp "build/aur/$pkg/PKGBUILD" "build/aur/$pkg/.SRCINFO" "$repo/"
            git -C "$repo" add PKGBUILD .SRCINFO
            # whitenoise-linux-git changes only when its recipe does.
            if git -C "$repo" diff --cached --quiet; then continue; fi
            git -C "$repo" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Update to $GITHUB_REF_NAME"
            git -C "$repo" push origin HEAD:master
          done
          rm -rf "$ssh_dir"

      - name: Remove AUR credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/aur-ssh" build/aur-git
          rm -f build/observability-tokens.toml

      - name: Stop build container
        if: always()
        shell: bash
        run: bash scripts/ci-container.sh stop
