# Release: Linux x86_64 AppImage/Flatpak/Orchard plus the cross.yml packages
# (Linux ARM64 and Windows built on Linux, macOS built on a Mac).
#
# Both packages install the same tree, via scripts/install-tree.sh:
#   * the binary at <prefix>/bin, its helper programs at
#     <prefix>/lib/whitenoise-linux, and the runtime data the app reads
#     from disk (the emoji sets, the emoji picker catalog, the fonts) at
#     <prefix>/share/whitenoise-linux. `res_dir` and `helper_path` in
#     app/paths.odin resolve those relative to the binary, so the layout
#     is a contract with them.
#   * Noto Sans CJK is deliberately NOT bundled: the .ttc is tens of
#     megabytes, so Japanese and Korean fall back to the host's system copy.
#
# AppImage: linuxdeploy copies the binary's shared-library dependencies
# into the AppDir (SDL3, libmpv and its codec deps, poppler, cairo,
# libarchive). Flatpak: packaging/flatpak/*.yml builds those libraries as
# modules on the GNOME 50 runtime (freedesktop 25.08 base).
name: Release candidate

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/ci-boat.sh
      - scripts/ci-container.sh
      - packaging/ci/**
      - packaging/flatpak/**

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && 'wn-rc' || format('rc-validation-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "6"
  WN_BUILD_JOBS: "6"
  CMAKE_BUILD_PARALLEL_LEVEL: "6"
  ODIN_VERSION: dev-2026-10
  SDL_VERSION: "3.4.14"
  FLATPAK_ID: dev.ipf.whitenoise
  # The AppImage tooling, pinned by tag and sha256 like everything else
  # this build fetches. Upstream's "continuous" release is mutable, so
  # these use its dated tags instead.
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  # Lets the linuxdeploy / appimagetool AppImages run on a runner without
  # FUSE, by self-extracting instead of mounting.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  stamp:
    name: Select and stamp green Canary
    if: github.event_name != 'pull_request' && github.repository == 'marmot-protocol/whitenoise-linux' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: wn-rc-stamp
    permissions:
      actions: read
      attestations: read
      checks: read
      contents: write
    outputs:
      canary_sha: ${{ steps.canary.outputs.canary_sha }}
      canary_run_id: ${{ steps.canary.outputs.canary_run_id }}
      tag: ${{ steps.reserve.outputs.tag }}
      commit_sha: ${{ steps.reserve.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false
      - name: Find an exact green Canary
        id: canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source="$RUNNER_TEMP/rc-source"
          git init -q "$source"
          cd "$source"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          bash "$GITHUB_WORKSPACE/policy/scripts/canary.sh" green
      - name: Select an unpublished source
        id: select
        if: steps.canary.outputs.canary_sha != ''
        working-directory: ${{ runner.temp }}/rc-source
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_SHA: ${{ steps.canary.outputs.canary_sha }}
        run: |
          git fetch --tags origin refs/heads/master
          bash "$GITHUB_WORKSPACE/policy/scripts/rc-select.sh" "$CANARY_SHA"
          git checkout --detach "$CANARY_SHA"
      - name: Require enabled immutable releases
        if: steps.select.outputs.stamp == 'true'
        env:
          GH_TOKEN: ${{ secrets.WN_RC_SETTINGS_TOKEN || github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/immutable-releases" | jq -e '.enabled == true'
      - name: Sign the stamp commit and tag
        id: sign
        if: steps.select.outputs.stamp == 'true'
        working-directory: ${{ runner.temp }}/rc-source
        env:
          WN_RC_GIT_SIGNING_KEY: ${{ secrets.WN_RC_GIT_SIGNING_KEY }}
          CANARY_SHA: ${{ steps.canary.outputs.canary_sha }}
          GIT_AUTHOR_NAME: White Noise Release CI
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: White Noise Release CI
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          stamp=$(bash "$GITHUB_WORKSPACE/policy/scripts/rc-stamp.sh" "$CANARY_SHA" "$(date -u +%F)")
          read -r tag commit <<< "$stamp"
          printf 'tag=%s\ncommit_sha=%s\n' "$tag" "$commit" >> "$GITHUB_OUTPUT"
      - name: Reserve only the signed tag on GitHub
        id: reserve
        if: steps.sign.outputs.tag != ''
        working-directory: ${{ runner.temp }}/rc-source
        env:
          GH_TOKEN: ${{ secrets.WN_RC_TAG_TOKEN || github.token }}
          WN_RC_TAG: ${{ steps.sign.outputs.tag }}
          WN_RC_COMMIT: ${{ steps.sign.outputs.commit_sha }}
        run: |
          ref="refs/tags/$WN_RC_TAG"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --no-follow-tags origin "$ref:$ref"
          local_oid=$(git rev-parse "$ref")
          remote_oid=$(git ls-remote --refs origin "$ref" | cut -f1)
          test "$local_oid" = "$remote_oid"
          printf 'tag=%s\ncommit_sha=%s\n' "$WN_RC_TAG" "$WN_RC_COMMIT" >> "$GITHUB_OUTPUT"

  appimage:
    needs: stamp
    if: needs.stamp.outputs.commit_sha != ''
    name: AppImage (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: wn-boat-build
    env:
      BOAT_CI_KEY: ${{ secrets.BOAT_CI_KEY }}
      WN_RC_TAG: ${{ needs.stamp.outputs.tag }}
    defaults:
      run:
        shell: bash scripts/ci-boat.sh run {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stamp.outputs.commit_sha }}
          persist-credentials: false

      - name: Identify package source
        shell: bash
        run: git rev-parse HEAD

      - name: Start native build guest
        id: start
        shell: bash
        run: bash scripts/ci-boat.sh start native

      - name: Check release version
        run: bash scripts/version.sh "$WN_RC_TAG"

      - name: Set AppImage filename
        shell: bash
        run: echo "APPIMAGE_NAME=WhiteNoise-$WN_RC_TAG-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Build
        env:
          WN_METRICS_WRITE_TOKEN: ${{ secrets.WN_METRICS_WRITE_TOKEN }}
          WN_AUDIT_WRITE_TOKEN: ${{ secrets.WN_AUDIT_WRITE_TOKEN }}
        run: scripts/build.sh

      - name: Build AppImage updater
        run: bash scripts/build-appimage-updater.sh

      - name: Assemble AppDir
        run: |
          rm -rf AppDir
          scripts/install-tree.sh AppDir/usr whitenoise

      - name: Fetch AppImage tooling
        run: |
          set -euo pipefail
          wget -q -O linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage"
          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          echo "$LINUXDEPLOY_SHA256  linuxdeploy" | sha256sum -c -
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x linuxdeploy appimagetool

      - name: Exercise signed AppImage upgrades
        run: bun tests/appimage-update-smoke.ts ./appimagetool ./build/appimage-update-lib

      - name: Build AppImage
        env:
          WN_APPIMAGE_SIGNING_KEY: ${{ secrets.WN_APPIMAGE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          bash scripts/bundle-appimage.sh ./linuxdeploy AppDir build/appimage-update-lib
          bash scripts/sign-appimage.sh ./appimagetool AppDir "$APPIMAGE_NAME"

      - name: Retrieve AppImage and update metadata
        shell: bash
        run: bash scripts/ci-boat.sh pull "$APPIMAGE_NAME" "$APPIMAGE_NAME.zsync"

      - name: Run the AppImage on Ubuntu 22.04
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm -v "$PWD/$APPIMAGE_NAME:/release.AppImage:ro" \
            docker.io/library/ubuntu:22.04 bash -ec '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                libgl1 libegl1 libgl1-mesa-dri libx11-6 libxext6 libxrender1 libnss3 \
                libfontconfig1 libasound2 libfribidi0 libharfbuzz0b libjack-jackd2-0 \
                libpipewire-0.3-0 libusb-1.0-0 xvfb xauth
              getconf GNU_LIBC_VERSION
              cd "$(mktemp -d)"
              APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGELAUNCHER_DISABLE=1 SDL_VIDEODRIVER=x11 \
                WN_SHOT=1 WN_VAULT_PW=ci-smoke xvfb-run -a /release.AppImage "$PWD/data"
              test -s wn-odin-shot.png
            '

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            ${{ env.APPIMAGE_NAME }}
            ${{ env.APPIMAGE_NAME }}.zsync
          if-no-files-found: error

      - name: Remove generated observability credentials
        if: always() && steps.start.outcome == 'success'
        run: rm -f build/observability-tokens.toml

      - name: Stop build guest
        if: always()
        shell: bash
        run: bash scripts/ci-boat.sh stop

  orchard-publisher:
    name: Orchard publisher (x86_64)
    needs: stamp
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (needs.stamp.result == 'success' && needs.stamp.outputs.commit_sha != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ github.event_name == 'pull_request' && 'wn-github-pr' || 'wn-boat-build' }}
    env:
      BOAT_CI_KEY: ${{ github.event_name != 'pull_request' && secrets.BOAT_CI_KEY || '' }}
      ORCHARD_RUST_VERSION: '1.100.0'
    defaults:
      run:
        shell: bash scripts/ci-boat.sh run {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stamp.outputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Identify publisher source
        shell: bash
        run: git rev-parse HEAD

      - name: Identify pinned Orchard source
        if: github.event_name != 'pull_request'
        id: orchard-source
        shell: bash
        run: |
          digest=$(awk '$1 == "orchard-source-file" && $2 == "=" {print $3}' DEPS_PIN)
          [[ $digest =~ ^[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore Orchard publisher
        if: github.event_name != 'pull_request'
        id: orchard-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: build/orchard-publish
          key: orchard-publisher-v1-ubuntu24-x64-${{ env.ORCHARD_RUST_VERSION }}-${{ steps.orchard-source.outputs.digest }}-${{ hashFiles('scripts/build-orchard.sh', 'scripts/fetch.sh', 'scripts/ci-boat.sh', 'scripts/ci-container.sh', 'packaging/ci/Containerfile', 'patches/orchard-*.patch') }}

      - name: Start native build guest
        if: steps.orchard-cache.outputs.cache-hit != 'true'
        id: orchard-guest
        shell: bash
        run: bash scripts/ci-boat.sh start native

      - name: Build pinned publisher only
        if: steps.orchard-guest.outcome == 'success'
        run: |
          rustup toolchain install '${{ env.ORCHARD_RUST_VERSION }}' --profile minimal
          RUSTUP_TOOLCHAIN='${{ env.ORCHARD_RUST_VERSION }}' scripts/build-orchard.sh

      - name: Retrieve Orchard publisher
        if: steps.orchard-guest.outcome == 'success'
        shell: bash
        run: bash scripts/ci-boat.sh pull build/orchard-publish

      - uses: actions/upload-artifact@v4
        with:
          name: orchard-publisher
          path: build/orchard-publish
          if-no-files-found: error

      - name: Stop build guest
        if: always() && steps.orchard-guest.outcome != 'skipped'
        shell: bash
        run: bash scripts/ci-boat.sh stop

      - name: Save Orchard publisher
        if: github.event_name != 'pull_request' && steps.orchard-guest.outcome == 'success' && steps.orchard-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/orchard-publish
          key: ${{ steps.orchard-cache.outputs.cache-primary-key }}

  flatpak:
    name: Flatpak (x86_64)
    needs: [stamp, orchard-publisher]
    if: ${{ !cancelled() && needs.orchard-publisher.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: ${{ github.event_name == 'pull_request' && 'wn-github-pr' || 'wn-boat-build' }}
    defaults:
      run:
        shell: bash scripts/ci-boat.sh run {0}
    env:
      BOAT_CI_KEY: ${{ github.event_name != 'pull_request' && secrets.BOAT_CI_KEY || '' }}
      WN_RC_TAG: ${{ needs.stamp.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stamp.outputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Identify package source and filename
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          name=${WN_RC_TAG:-${GITHUB_REF_NAME//\//-}}
          printf 'WN_SOURCE_SHA=%s\nWN_FLATPAK_BUNDLE=WhiteNoise-%s-x86_64.flatpak\n' "$sha" "$name" >> "$GITHUB_ENV"
          echo "Flatpak source: $sha"

      - name: Start Flatpak build guest
        shell: bash
        run: bash scripts/ci-boat.sh start flatpak

      - name: Check release version
        if: env.WN_RC_TAG != ''
        run: bash scripts/version.sh "$WN_RC_TAG"

      - name: Prepare Flatpak builder
        id: flatpak-prepare
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/flatpak-prepare.log"
          script="$RUNNER_TEMP/flatpak-prepare.sh"
          cat > "$script" <<'PREPARE'
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # Keep relative manifest sources rooted in the checkout.
          flatpak-builder --show-manifest "packaging/flatpak/$FLATPAK_ID.yml" \
            | jq '."build-options".env += {"CARGO_BUILD_JOBS":"6","WN_BUILD_JOBS":"6","CMAKE_BUILD_PARALLEL_LEVEL":"6"}' \
            > packaging/flatpak/ci-manifest.json
          flatpak-builder --user --install-deps-from=flathub --install-deps-only \
            --arch=x86_64 --state-dir=build/flatpak-state build/flatpak packaging/flatpak/ci-manifest.json
          if [[ -n $WN_RC_TAG ]]; then
            # Hash full commit IDs for the SDK and its installed extensions.
            if digest=$({
              flatpak-builder --version || exit 1
              flatpak list --user --all --runtime --columns=ref | LC_ALL=C sort | while read -r ref; do
                printf '%s ' "$ref"
                flatpak info --user --show-commit "$ref" || exit 1
              done || exit 1
              jq -cS . packaging/flatpak/ci-manifest.json
            } | sha256sum | cut -d' ' -f1); then
              echo "Flatpak module cache digest: $digest"
            else
              echo '::warning::Flatpak cache inputs unavailable. Building without the module cache.'
            fi
          fi
          PREPARE
          bash scripts/ci-boat.sh run "$script" | tee "$log"
          digest=$(awk '/^Flatpak module cache digest: / {print $NF}' "$log")
          if [[ $digest =~ ^[0-9a-f]{64}$ ]]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Flatpak module cache
        if: steps.flatpak-prepare.outputs.digest != ''
        id: flatpak-cache
        uses: actions/cache/restore@v4
        with:
          path: build/flatpak-module-cache.tar.gz
          key: flatpak-modules-v2-${{ steps.flatpak-prepare.outputs.digest }}

      - name: Send Flatpak module cache to guest
        if: steps.flatpak-cache.outputs.cache-hit == 'true'
        shell: bash
        run: bash scripts/ci-boat.sh push build/flatpak-module-cache.tar.gz

      - name: Unpack Flatpak module cache
        if: steps.flatpak-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p build/flatpak-state
          tar -xzf build/flatpak-module-cache.tar.gz -C build/flatpak-state

      # Only RC jobs write this cache, before any app module runs. Save just
      # the installed module snapshots, not the SDK, sources, or build trees.
      - name: Build tokenless Flatpak modules
        if: env.WN_RC_TAG != '' && steps.flatpak-cache.outputs.cache-primary-key != '' && steps.flatpak-cache.outputs.cache-hit != 'true'
        id: flatpak-cache-build
        run: |
          xvfb-run --auto-servernum flatpak-builder \
            --user --disable-rofiles-fuse --force-clean \
            --jobs=6 --default-branch=master --arch=x86_64 --state-dir=build/flatpak-state \
            --stop-at=whitenoise-linux build/flatpak packaging/flatpak/ci-manifest.json
          tar -czf build/flatpak-module-cache.tar.gz -C build/flatpak-state cache

      - name: Retrieve tokenless Flatpak module cache
        if: steps.flatpak-cache-build.outcome == 'success'
        shell: bash
        run: bash scripts/ci-boat.sh pull build/flatpak-module-cache.tar.gz

      - name: Save tokenless Flatpak module cache
        if: steps.flatpak-cache-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/flatpak-module-cache.tar.gz
          key: ${{ steps.flatpak-cache.outputs.cache-primary-key }}

      - name: Build Flatpak and bundle
        env:
          WN_METRICS_WRITE_TOKEN: ${{ needs.stamp.outputs.commit_sha != '' && secrets.WN_METRICS_WRITE_TOKEN || '' }}
          WN_AUDIT_WRITE_TOKEN: ${{ needs.stamp.outputs.commit_sha != '' && secrets.WN_AUDIT_WRITE_TOKEN || '' }}
        run: |
          xvfb-run --auto-servernum flatpak-builder \
            --user --repo=build/flatpak-repo \
            --disable-rofiles-fuse --force-clean --jobs=6 \
            --default-branch=master --arch=x86_64 --subject="Built from $WN_SOURCE_SHA" \
            --state-dir=build/flatpak-state \
            build/flatpak packaging/flatpak/ci-manifest.json
          flatpak build-bundle build/flatpak-repo \
            "$WN_FLATPAK_BUNDLE" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            --arch=x86_64 "$FLATPAK_ID" master

      # Same smoke test as the AppImage: install the bundle and boot it
      # against SDL's dummy driver.
      - name: Run the Flatpak headless
        run: |
          set -euo pipefail
          flatpak install --user -y --noninteractive \
            "$WN_FLATPAK_BUNDLE"
          flatpak run --user --env=SDL_VIDEODRIVER=dummy --env=WN_SHOT=1 \
            --env=WN_VAULT_PW=ci-smoke "$FLATPAK_ID" "$(mktemp -d)"

      - uses: actions/download-artifact@v4
        with:
          name: orchard-publisher
          path: build

      - name: Send Orchard publisher to guest
        shell: bash
        run: bash scripts/ci-boat.sh push build/orchard-publish

      - name: Prepare unsigned Orchard components
        run: |
          chmod +x build/orchard-publish
          args=()
          if [[ -n "$WN_RC_TAG" ]]; then args+=("$WN_RC_TAG"); fi
          scripts/orchard-package.sh build/flatpak build/orchard-release "${args[@]}"

      # Install the archived bytes, not the preparer's internal layout. Remove
      # only the app already tested above so Flatpak cannot reuse that install;
      # leave its GNOME 50 runtime available for the OCI installation.
      - name: Install and run the Orchard archive headless
        run: |
          set -euo pipefail
          version="$(flatpak --version)"
          version="${version##* }"
          IFS=. read -r major minor patch <<< "$version"
          if (( major < 1 || (major == 1 && minor < 18) )); then
            echo "::error::OCI installation requires Flatpak 1.18+, found $version"
            exit 1
          fi
          layout="$(mktemp -d)"
          trap 'rm -rf "$layout"' EXIT
          tar -xzf build/orchard-release/dev.ipf.whitenoise-linux-x86_64.oci.tgz -C "$layout"
          flatpak uninstall --user -y --noninteractive "$FLATPAK_ID"
          flatpak install --user -y --noninteractive --no-deps "oci:$layout"
          test "$(flatpak info --user --show-ref "$FLATPAK_ID//stable")" = "app/$FLATPAK_ID/x86_64/stable"
          flatpak run --user --env=SDL_VIDEODRIVER=dummy --env=WN_SHOT=1 \
            --env=WN_VAULT_PW=ci-smoke "$FLATPAK_ID//stable" "$(mktemp -d)"

      - name: Retrieve Flatpak and Orchard artifacts
        shell: bash
        run: bash scripts/ci-boat.sh pull "$WN_FLATPAK_BUNDLE" build/orchard-release

      - uses: actions/upload-artifact@v4
        with:
          name: orchard
          path: build/orchard-release/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: ${{ env.WN_FLATPAK_BUNDLE }}
          if-no-files-found: error

      - name: Stop build guest
        if: always()
        shell: bash
        run: bash scripts/ci-boat.sh stop

  cross:
    needs: stamp
    if: needs.stamp.outputs.commit_sha != ''
    uses: ./.github/workflows/cross.yml
    with:
      source_sha: ${{ needs.stamp.outputs.commit_sha }}
      version: ${{ needs.stamp.outputs.tag }}
    secrets: inherit

  # The tarball the AUR's whitenoise-linux-bin installs, built on Arch
  # against Arch's libraries from the same metadata as whitenoise-linux-git.
  archlinux:
    needs: stamp
    if: needs.stamp.outputs.commit_sha != ''
    name: Arch Linux (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: wn-boat-build
    env:
      BOAT_CI_KEY: ${{ secrets.BOAT_CI_KEY }}
      WN_RC_TAG: ${{ needs.stamp.outputs.tag }}
      WN_RELEASE_VERSION: ${{ needs.stamp.outputs.tag }}
    defaults:
      run:
        shell: bash scripts/ci-boat.sh run {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stamp.outputs.commit_sha }}
          persist-credentials: false

      - name: Identify package source
        shell: bash
        run: git rev-parse HEAD

      - name: Start Arch build guest
        id: start
        shell: bash
        run: bash scripts/ci-boat.sh start arch

      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - name: Check release version
        run: bash scripts/version.sh "$WN_RC_TAG"

      - name: Install build dependencies
        run: |
          source packaging/arch/whitenoise-linux-git/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"

      # The PKGBUILD's pinned release, checked against its sha256 there.
      - name: Install Odin
        run: |
          source packaging/arch/whitenoise-linux-git/PKGBUILD
          if [ "$_odin" != "$ODIN_VERSION" ]; then
            echo "PKGBUILD pins Odin $_odin, this workflow $ODIN_VERSION" >&2
            exit 1
          fi
          curl -sSfL -o /tmp/odin.tar.gz "${source[1]}"
          echo "${sha256sums[1]}  /tmp/odin.tar.gz" | sha256sum -c -
          mkdir -p /opt/odin
          tar -xzf /tmp/odin.tar.gz -C /opt/odin --strip-components=1

      - name: Build
        env:
          WN_METRICS_WRITE_TOKEN: ${{ secrets.WN_METRICS_WRITE_TOKEN }}
          WN_AUDIT_WRITE_TOKEN: ${{ secrets.WN_AUDIT_WRITE_TOKEN }}
        run: scripts/arch-package.sh

      - name: Retrieve Arch package
        shell: bash
        run: bash scripts/ci-boat.sh pull dist

      - uses: actions/upload-artifact@v4
        with:
          name: archlinux
          path: dist/*-archlinux-x86_64.tar.zst
          if-no-files-found: error

      - name: Remove generated observability credentials
        if: always() && steps.start.outcome == 'success'
        run: rm -f build/observability-tokens.toml

      - name: Stop build guest
        if: always()
        shell: bash
        run: bash scripts/ci-boat.sh stop

  aur-check:
    name: Verify AUR packages
    needs: [stamp, archlinux]
    if: needs.stamp.outputs.commit_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: wn-boat-build
    env:
      BOAT_CI_KEY: ${{ secrets.BOAT_CI_KEY }}
      WN_RC_TAG: ${{ needs.stamp.outputs.tag }}
    defaults:
      run:
        shell: bash scripts/ci-boat.sh run {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stamp.outputs.commit_sha }}
          persist-credentials: false

      - name: Identify package source
        shell: bash
        run: git rev-parse HEAD

      - name: Start Arch build guest
        shell: bash
        run: bash scripts/ci-boat.sh start arch

      - name: Install tools
        run: pacman -Syu --noconfirm --needed git namcap

      - uses: actions/download-artifact@v4
        with:
          name: archlinux
          path: dist

      - name: Send Arch package to guest
        shell: bash
        run: bash scripts/ci-boat.sh push "dist/WhiteNoise-$WN_RC_TAG-archlinux-x86_64.tar.zst"

      - name: Render the packages
        run: bash scripts/aur-render.sh

      # The candidate is not public yet. makepkg checks the real PKGBUILD
      # checksum against the artifact under its future download name.
      - name: Install and boot whitenoise-linux-bin
        run: |
          archive="WhiteNoise-$WN_RC_TAG-archlinux-x86_64.tar.zst"
          srcdest=$(mktemp -d)
          trap 'rm -rf "$srcdest"' EXIT
          chown builder "$srcdest"
          install -o builder -m 0644 "dist/$archive" "$srcdest/$archive"
          su builder -c "cd build/aur/whitenoise-linux-bin && SRCDEST='$srcdest' makepkg --nodeps"
          pacman -U --noconfirm build/aur/whitenoise-linux-bin/whitenoise-linux-bin-*.pkg.tar.zst
          namcap build/aur/whitenoise-linux-bin/PKGBUILD build/aur/whitenoise-linux-bin/whitenoise-linux-bin-*.pkg.tar.zst
          data="$(mktemp -d)"
          (cd "$data" && SDL_VIDEODRIVER=dummy WN_SHOT=1 WN_VAULT_PW=ci-smoke whitenoise "$data")

      # Downloads every pinned source the from-source package lists and
      # checks its digest; the archlinux job already built the same inputs.
      - name: Verify whitenoise-linux sources
        run: su builder -c 'cd build/aur/whitenoise-linux && makepkg --verifysource --nodeps'

      - name: Stop build guest
        if: always()
        shell: bash
        run: bash scripts/ci-boat.sh stop

  publish:
    name: Publish immutable prerelease
    needs: [stamp, appimage, flatpak, cross, archlinux, aur-check]
    if: needs.stamp.outputs.commit_sha != ''
    runs-on: ubuntu-24.04
    concurrency:
      group: wn-release-metadata
      queue: max
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false
      - name: Publish this run's assets and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          WN_RC_TAG: ${{ needs.stamp.outputs.tag }}
          WN_RC_COMMIT: ${{ needs.stamp.outputs.commit_sha }}
          WN_CANARY_SHA: ${{ needs.stamp.outputs.canary_sha }}
          WN_CANARY_RUN: ${{ needs.stamp.outputs.canary_run_id }}
        run: |
          source="$RUNNER_TEMP/rc-source"
          git init -q "$source"
          cd "$source"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          bash "$GITHUB_WORKSPACE/policy/scripts/rc-publish.sh" "$GITHUB_WORKSPACE/dist"
