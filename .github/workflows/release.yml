# Release: triggered by a `v*` tag (e.g. v2026.9.15-build.1). Builds the app
# twice, as a self-contained AppImage and as a Flatpak bundle, and
# publishes both on a GitHub Release.
#
# Both packages install the same tree, via scripts/install-tree.sh:
#   * the binary at <prefix>/bin, and the runtime data the app reads from
#     disk (Twemoji tiles, the emoji picker catalog, the fonts) at
#     <prefix>/share/whitenoise-linux. `res_dir` in app/paths.odin resolves
#     that relative to the binary, so the layout is a contract with it.
#   * Noto Sans CJK is deliberately NOT bundled: the .ttc is tens of
#     megabytes, so Japanese falls back to the host's system copy.
#
# AppImage: linuxdeploy copies the binary's shared-library dependencies
# into the AppDir (SDL3, libmpv and its codec deps, poppler, cairo,
# libarchive). Flatpak: packaging/flatpak/*.yml builds those libraries as
# modules on the GNOME 50 runtime (freedesktop 25.08 base).
name: Release

on:
  push:
    tags: ["v*"]

env:
  ODIN_VERSION: dev-2026-08
  SDL_VERSION: "3.4.14"
  FLATPAK_ID: dev.ipf.whitenoise
  # The AppImage tooling, pinned by tag and sha256 like everything else
  # this build fetches. Upstream's "continuous" release is mutable, so
  # these use its dated tags instead.
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  # Lets the linuxdeploy / appimagetool AppImages run on a runner without
  # FUSE, by self-extracting instead of mounting.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        run: bash scripts/version.sh "$GITHUB_REF_NAME"

      # The app's own deps, plus the file/desktop utils linuxdeploy
      # expects.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake ninja-build clang git curl \
            libarchive-dev libwebp-dev libmpv-dev libpoppler-glib-dev libcairo2-dev libcurl4-openssl-dev libssl-dev \
            libglib2.0-dev libfreetype-dev \
            file desktop-file-utils wget ca-certificates unzip

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-ubuntu-24.04

      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "release-$SDL_VERSION" \
            https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local/sdl3
          cmake --build /tmp/SDL/build --target install

      - name: Put SDL3 on the linker path
        run: |
          echo /usr/local/sdl3/lib | sudo tee /etc/ld.so.conf.d/sdl3.conf
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/sdl3/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=/usr/local/sdl3/lib" >> "$GITHUB_ENV"

      - name: Cache Odin
        id: odin-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/odin
          key: odin-${{ env.ODIN_VERSION }}-ubuntu-24.04

      - name: Install Odin
        if: steps.odin-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /usr/local/odin
          curl -sSfL "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz" \
            | sudo tar xz -C /usr/local/odin --strip-components=1
          sudo chmod +x /usr/local/odin/odin

      - name: Put Odin on PATH
        run: echo /usr/local/odin >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: scripts/build.sh

      - name: Assemble AppDir
        run: |
          rm -rf AppDir
          scripts/install-tree.sh AppDir/usr whitenoise

      - name: Fetch AppImage tooling
        run: |
          set -euo pipefail
          wget -q -O linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage"
          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          echo "$LINUXDEPLOY_SHA256  linuxdeploy" | sha256sum -c -
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x linuxdeploy appimagetool

      - name: Build AppImage
        run: |
          set -euo pipefail
          # SDL3 lives outside the default search path, so point linuxdeploy
          # at it or it bundles everything except the one library that is
          # not installed system-wide.
          export LD_LIBRARY_PATH="/usr/local/sdl3/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/whitenoise \
            --executable AppDir/usr/bin/wn-tts \
            --executable AppDir/usr/bin/wn-stt \
            --executable AppDir/usr/share/whitenoise-linux/wn-font \
            --desktop-file AppDir/usr/share/applications/whitenoise.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/whitenoise.png
          out="WhiteNoise-${GITHUB_REF_NAME}-x86_64.AppImage"
          # -u embeds update info and emits a .zsync next to the AppImage,
          # so AppImageUpdate can delta-update against the latest release.
          ./appimagetool -u "gh-releases-zsync|marmot-protocol|whitenoise-linux|latest|WhiteNoise-*-x86_64.AppImage.zsync" \
            AppDir "$out"
          echo "APPIMAGE_NAME=$out" >> "$GITHUB_ENV"

      # A smoke test of the packaged artifact, not of the app: SDL's dummy
      # video driver lets it boot with no display, and WN_SHOT exits after a
      # few frames. Catches a missing bundled library or a res_dir that no
      # longer finds its data.
      - name: Run the AppImage headless
        run: |
          set -euo pipefail
          chmod +x "$APPIMAGE_NAME"
          SDL_VIDEODRIVER=dummy WN_SHOT=1 WN_VAULT_PW=ci-smoke \
            ./"$APPIMAGE_NAME" "$(mktemp -d)"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            ${{ env.APPIMAGE_NAME }}
            ${{ env.APPIMAGE_NAME }}.zsync
          if-no-files-found: error

  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        run: bash scripts/version.sh "$GITHUB_REF_NAME"

      # The app module needs network during the build (scripts/build.sh clones
      # mdk/clay/ufbx/microtex, cargo fetches crates), which the manifest declares
      # in its build-args; the action passes it through.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/${{ env.FLATPAK_ID }}.yml
          bundle: WhiteNoise-${{ github.ref_name }}-x86_64.flatpak
          upload-artifact: false
          cache: false

      # Same smoke test as the AppImage: install the bundle and boot it
      # against SDL's dummy driver.
      - name: Run the Flatpak headless
        run: |
          set -euo pipefail
          flatpak install --user -y --noninteractive \
            "WhiteNoise-${GITHUB_REF_NAME}-x86_64.flatpak"
          flatpak run --user --env=SDL_VIDEODRIVER=dummy --env=WN_SHOT=1 \
            --env=WN_VAULT_PW=ci-smoke "$FLATPAK_ID" "$(mktemp -d)"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: WhiteNoise-${{ github.ref_name }}-x86_64.flatpak
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file over everything the release ships, so a
      # download can be verified without trusting the release page alone.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.AppImage *.zsync *.flatpak > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.zsync
            dist/*.flatpak
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
