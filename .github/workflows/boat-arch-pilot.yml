name: Boat Arch release pilot

on:
  push:
    branches: [ci/boat-actions-pilot]

permissions:
  contents: read

jobs:
  arch:
    if: github.repository == 'marmot-protocol/whitenoise-linux' && github.actor == 'dannym-arx'
    runs-on: ubuntu-24.04
    environment: wn-boat-arch-pilot
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and boot the Arch package on Boat
        env:
          BOAT_API_KEY: ${{ secrets.BOAT_PILOT_KEY }}
          BOAT_NO_UPDATE: '1'
        run: |
          set -euo pipefail
          boat="$RUNNER_TEMP/boat"
          curl -fsSL 'https://boat.dev/api/boat/cli/download?platform=linux-x64&channel=prod' -o "$boat"
          printf '%s  %s\n' 9f2fb5529ad7ca58e4d724bb6bfcd6ff94cb3077a7c12a0941e501aa0e9335ec "$boat" | sha256sum -c -
          chmod 700 "$boat"
          "$boat" --version
          printf '%s\n' "$BOAT_API_KEY" | "$boat" login --key-stdin --json >/dev/null
          unset BOAT_API_KEY

          receipt="$RUNNER_TEMP/sandbox.jsonl"
          : > "$receipt"
          cleanup() {
            id=$(jq -r 'select(.event == "created" or .event == "ready") | .id' "$receipt" | head -n 1)
            if [[ -n $id ]]; then "$boat" delete "$id" --yes --json; fi
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
          time "$boat" new --name "wn-arch-pilot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --type large --environment wn-github-arch-pilot-20261124 --no-snapshots --ttl 2400 --json | tee "$receipt"
          id=$(jq -er 'select(.event == "ready") | .id' "$receipt")
          time "$boat" scp "$RUNNER_TEMP/source.tar.gz" "$id:source.tar.gz"
          time "$boat" ssh "$id" -- 'mkdir -p pilot && tar xzf source.tar.gz -C pilot && cd pilot && bash scripts/boat-arch-pilot.sh'

          artifact="WhiteNoise-$(bash scripts/version.sh)-archlinux-x86_64.tar.zst"
          mkdir -p dist
          time "$boat" scp "$id:pilot/dist/$artifact" "dist/$artifact"
          "$boat" scp "$id:pilot/dist/SHA256SUMS.txt" dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: boat-arch-pilot
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
