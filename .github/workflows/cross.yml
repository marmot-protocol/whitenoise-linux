name: Cross releases

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""
    secrets:
      WN_METRICS_WRITE_TOKEN:
        required: false
      WN_AUDIT_WRITE_TOKEN:
        required: false
      JSIGN_KEYSTORE_BASE64:
        required: false
      JSIGN_KEYSTORE:
        required: false
      JSIGN_STOREPASS:
        required: false
      WN_SPARKLE_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Archive version (empty uses VERSION)
        required: false
        default: ""

jobs:
  cross:
    name: Cross ${{ matrix.target }} on Linux
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-24.04"' || format('["self-hosted","Linux","X64","wn-build-server","arch","{0}"]', matrix.target == 'windows-amd64' && 'wn-cache-1' || 'wn-cache-2')) }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash scripts/ci-container.sh run {0}
    env:
      CARGO_BUILD_JOBS: 6
      WN_BUILD_JOBS: 6
      CMAKE_BUILD_PARALLEL_LEVEL: 6
    strategy:
      fail-fast: false
      matrix:
        # linux-amd64 is not a cross build, but the same portable tarball
        # recipe as linux-arm64 (Ubuntu 24.04 sysroot, bundled libraries).
        target: [linux-arm64, linux-amd64, windows-amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start cross build container
        shell: bash
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          bash scripts/ci-container.sh start cross
      # Persistent dependencies retain their existing input stamps; Cargo and
      # vcpkg validate their own caches. Never reuse publication or smoke trees.
      - name: Clear previous packages and smoke evidence
        run: rm -rf dist build/cross-smoke build/cross-evidence
      # Tagged releases build a delta from the previous GitHub release.
      # JSIGN_STORETYPE enables optional signing; see README for credentials.
      - name: Prepare Windows signing
        if: matrix.target == 'windows-amd64' && inputs.version != ''
        env:
          JSIGN_STORETYPE: ${{ vars.JSIGN_STORETYPE }}
          JSIGN_KEYSTORE_BASE64: ${{ secrets.JSIGN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          if [ -n "$JSIGN_KEYSTORE_BASE64" ]; then
            printf '%s' "$JSIGN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/keystore"
          fi
      - name: Cross compile and package
        env:
          WN_RELEASE_VERSION: ${{ inputs.version }}
          WN_METRICS_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_METRICS_WRITE_TOKEN || '' }}
          WN_AUDIT_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_AUDIT_WRITE_TOKEN || '' }}
          RELEASE: ${{ matrix.target == 'windows-amd64' && inputs.version != '' }}
          JSIGN_STORETYPE: ${{ vars.JSIGN_STORETYPE }}
          JSIGN_ALIAS: ${{ vars.JSIGN_ALIAS }}
          JSIGN_KEYSTORE_SECRET: ${{ secrets.JSIGN_KEYSTORE }}
          JSIGN_STOREPASS: ${{ secrets.JSIGN_STOREPASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE" = true ]; then
            # RUNNER_TEMP is mounted at the same path; cloud stores use a URL.
            export JSIGN_KEYSTORE="$JSIGN_KEYSTORE_SECRET"
            if [ -f "$RUNNER_TEMP/signing/keystore" ]; then
              export JSIGN_KEYSTORE="$RUNNER_TEMP/signing/keystore"
            fi
            export WN_VELOPACK_REPO="https://github.com/${{ github.repository }}"
          fi
          bash scripts/cross-build.sh '${{ matrix.target }}'
      - name: Remove generated observability credentials
        if: always()
        shell: bash
        run: rm -f build/observability-tokens.toml
      - name: Remove signing material
        if: always() && matrix.target == 'windows-amd64'
        shell: bash
        run: rm -rf "$RUNNER_TEMP/signing"
      - name: Extract and execute shipped package
        run: |
          mkdir -p build/cross-smoke/package build/cross-evidence
          if [ '${{ matrix.target }}' = windows-amd64 ]; then
            # Velopack's portable zip has no top directory; a staging zip does.
            if [ -f dist/WhiteNoise-win-Portable.zip ]; then
              unzip -q dist/WhiteNoise-win-Portable.zip -d build/cross-smoke/package
            else
              unzip -q dist/*-windows-amd64.zip -d build/cross-smoke
            fi
          else
            tar -xzf dist/*-${{ matrix.target }}.tar.gz -C build/cross-smoke
          fi
          root=build/cross-smoke/package
          if [ ! -e "$root/current" ]; then
            root=$(find build/cross-smoke -mindepth 1 -maxdepth 1 -type d ! -name package -print -quit)
          fi
          root=$(realpath "$root")
          args=('${{ matrix.target }}' "$root")
          if [ '${{ matrix.target }}' = linux-arm64 ]; then
            args+=("$PWD/build/cross/linux-arm64/sysroot")
          fi
          script="$PWD/scripts/cross-smoke.sh"
          cd build/cross-evidence
          bash "$script" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.target }}
          path: |
            dist/*-${{ matrix.target }}.*
            dist/WhiteNoise-win-*
            dist/*.nupkg
            dist/*.win.json
            dist/RELEASES
          if-no-files-found: error
      # Visual proof of the headless boot, kept apart from the release files.
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: build/cross-evidence/${{ matrix.target }}.png
          if-no-files-found: error
      - name: Stop cross build container
        if: always()
        shell: bash
        run: bash scripts/ci-container.sh stop

  # Trusted builds use the slot's persistent KVM disks; fork PRs use an
  # ephemeral hosted guest. Both run the full native build and package smokes.
  openbsd:
    name: Build openbsd-amd64 in a VM
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-24.04"' || '["self-hosted","Linux","X64","wn-build-server","arch","wn-cache-1"]') }}
    timeout-minutes: 180
    env:
      WN_RELEASE_VERSION: ${{ inputs.version }}
      WN_METRICS_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_METRICS_WRITE_TOKEN || '' }}
      WN_AUDIT_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_AUDIT_WRITE_TOKEN || '' }}
      CARGO_BUILD_JOBS: 6
      WN_BUILD_JOBS: 6
      CMAKE_BUILD_PARALLEL_LEVEL: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch sources
        run: bash scripts/build.sh sources
      - name: Build and package in persistent OpenBSD KVM guest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bash scripts/wn-server-openbsd-smoke.sh
      - name: Build and package in hosted OpenBSD guest
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: openbsd
          version: "7.9"
          architecture: x86-64
          cpu_count: 4
          memory: 12G
          environment_variables: WN_RELEASE_VERSION WN_METRICS_WRITE_TOKEN WN_AUDIT_WRITE_TOKEN
          run: |
            sudo pkg_add -I bash git cmake ninja gmake coreutils llvm%21 rust unzip-- \
              sdl3 libarchive libwebp mpv poppler cairo curl glib2 ffmpeg zenity libnotify zstd
            # The image's root filesystem has ~4 GB left after the packages,
            # short of cargo's ~2.3 GB plus the workspace. Build Rust on a
            # swap-backed memory filesystem; root's class caps data at 4 GB.
            sudo sh -c 'ulimit -d unlimited && mkdir -p /mnt/scratch && mount_mfs -s 8g swap /mnt/scratch && chown runner /mnt/scratch'
            export CARGO_TARGET_DIR=/mnt/scratch/target CARGO_HOME=/mnt/scratch/cargo
            mkdir -p "$CARGO_TARGET_DIR" "$CARGO_HOME/registry" "$CARGO_HOME/git"
            trap 'rm -f build/observability-tokens.toml; rm -rf build/openbsd/odin' EXIT
            bash scripts/openbsd-build.sh
      - name: Remove generated observability credentials
        if: always()
        run: rm -f build/observability-tokens.toml
      - uses: actions/upload-artifact@v4
        with:
          name: cross-openbsd-amd64
          path: dist/*-openbsd-amd64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-openbsd-amd64
          path: build/openbsd/wn-odin-shot.png
          if-no-files-found: error

  # Apple's SDK is licensed for Apple hardware, so macOS packages build on a
  # Mac. One Apple silicon runner builds both architectures; the Intel bundle
  # is smoke-tested under Rosetta. ponytail: GitHub-hosted until the
  # self-hosted Mac mini runs these same scripts under ngit act.
  macos:
    name: Build ${{ matrix.target }} on macOS
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned build tool downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/tools/odin.tar.gz
            ${{ runner.temp }}/tools/bun.zip
            ~/Library/Caches/Homebrew
          key: cross-macos-tools-${{ runner.arch }}-${{ hashFiles('scripts/macos-setup.sh') }}
      - name: Install pinned build tools
        run: scripts/macos-setup.sh "$RUNNER_TEMP/tools"
      - name: Require macOS release signing key
        if: inputs.version != '' || github.ref_type == 'tag'
        env:
          WN_SPARKLE_PRIVATE_KEY: ${{ secrets.WN_SPARKLE_PRIVATE_KEY }}
        run: test -n "$WN_SPARKLE_PRIVATE_KEY" || { echo 'Missing WN_SPARKLE_PRIVATE_KEY for macOS release' >&2; exit 1; }
      - name: Identify compiler environment
        id: toolchain
        run: |
          source "$RUNNER_TEMP/tools/env"
          fingerprint=$({
            rustc -vV
            cargo -V
            xcrun clang --version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
          } | sha256sum | cut -d' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      # Restore incremental Cargo state, never an unchecked final archive.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.target }}-${{ hashFiles('DEPS_PIN', 'packaging/cross/vcpkg.json', 'scripts/cross-toolchain.sh', 'scripts/cross-deps.sh') }}
          restore-keys: vcpkg-${{ matrix.target }}-
      - name: Restore Cargo state
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/cargo
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
          key: cross-cargo-v2-${{ matrix.target }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('DEPS_PIN', 'patches/mdk-*.patch', 'scripts/cross-build.sh', 'scripts/cross-toolchain.sh') }}-${{ github.sha }}
          restore-keys: |
            cross-cargo-v2-${{ matrix.target }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('DEPS_PIN', 'patches/mdk-*.patch', 'scripts/cross-build.sh', 'scripts/cross-toolchain.sh') }}-
            cross-cargo-v2-${{ matrix.target }}-${{ steps.toolchain.outputs.fingerprint }}-
      - name: Restore C dependencies
        id: cdeps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/fbx/ufbx.o
            build/cross/${{ matrix.target }}/fbx/ufbx.stamp
            build/cross/${{ matrix.target }}/mpv-stage
            build/cross/${{ matrix.target }}/mpv.stamp
            build/cross/${{ matrix.target }}/sherpa-onnx
            build/cross/${{ matrix.target }}/vcpkg-installed
            build/cross/${{ matrix.target }}/vcpkg.stamp
            vendor/vcpkg
            !vendor/vcpkg/buildtrees
            !vendor/vcpkg/packages
          key: cross-cdeps-v2-${{ matrix.target }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('DEPS_PIN', 'packaging/cross/vcpkg.json', 'scripts/cross-build.sh', 'scripts/cross-toolchain.sh', 'scripts/cross-deps.sh') }}
          restore-keys: cross-cdeps-v2-${{ matrix.target }}-${{ steps.toolchain.outputs.fingerprint }}-
      - name: Build and package
        env:
          WN_RELEASE_VERSION: ${{ inputs.version }}
          WN_SPARKLE_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (inputs.version != '' || github.ref_type == 'tag') && secrets.WN_SPARKLE_PRIVATE_KEY || '' }}
          WN_METRICS_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_METRICS_WRITE_TOKEN || '' }}
          WN_AUDIT_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_AUDIT_WRITE_TOKEN || '' }}
        run: |
          source "$RUNNER_TEMP/tools/env"
          bash scripts/cross-build.sh '${{ matrix.target }}'
      - name: Remove generated observability credentials
        if: always()
        run: rm -f build/observability-tokens.toml
      - name: Save Cargo state
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/cargo
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Save C dependencies
        if: always() && steps.cdeps-cache.outputs.cache-hit != 'true' && hashFiles(format('build/cross/{0}/fbx/ufbx.stamp', matrix.target)) != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/fbx/ufbx.o
            build/cross/${{ matrix.target }}/fbx/ufbx.stamp
            build/cross/${{ matrix.target }}/mpv-stage
            build/cross/${{ matrix.target }}/mpv.stamp
            build/cross/${{ matrix.target }}/sherpa-onnx
            build/cross/${{ matrix.target }}/vcpkg-installed
            build/cross/${{ matrix.target }}/vcpkg.stamp
            vendor/vcpkg
            !vendor/vcpkg/buildtrees
            !vendor/vcpkg/packages
          key: ${{ steps.cdeps-cache.outputs.cache-primary-key }}
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      # Apple clang has crashed (SIGABRT) on harfbuzz here. Keep its crash
      # report and preprocessed reproducer, which otherwise die with the runner.
      - name: Collect compiler crash reports
        if: failure()
        run: |
          mkdir -p build/clang-crash
          find ~/Library/Logs/DiagnosticReports -name 'clang*' -exec cp {} build/clang-crash/ \;
          find "${TMPDIR:-/tmp}" -maxdepth 1 \( -name '*.sh' -o -name '*.cpp' -o -name '*.c' \) -newer "$GITHUB_WORKSPACE/DEPS_PIN" \
            -exec cp {} build/clang-crash/ \;
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: clang-crash-${{ matrix.target }}
          path: build/clang-crash/
          if-no-files-found: ignore
      - name: Check decoder limits and timestamps
        run: |
          cpu=arm64
          if [ '${{ matrix.target }}' = darwin-amd64 ]; then cpu=x86_64; fi
          clang -arch "$cpu" -O2 -Wall -Wextra -Werror tests/decoder-limits-test.c -o build/decoder-limits-test
          arch "-$cpu" build/decoder-limits-test
          clang -arch "$cpu" -O2 -Wall -Wextra -Werror tests/timestamp-test.c app/timestamp.c -o build/timestamp-test
          arch "-$cpu" build/timestamp-test
      - name: Check Sparkle metadata, publisher trust, and nonbundle behavior
        run: |
          source "$RUNNER_TEMP/tools/env"
          # Without ./ Bun treats this as a filter and scans build/ and vendor/,
          # retaining their directory handles before loading the test module.
          bun test ./tests/sparkle-package.test.js
          cpu=arm64
          if [ '${{ matrix.target }}' = darwin-amd64 ]; then cpu=x86_64; fi
          clang -arch "$cpu" -O2 -Wall -Wextra -Werror tests/sparkle-bridge-test.c \
            build/cross/${{ matrix.target }}/libwnsparkle.a -framework Cocoa -lobjc -o build/sparkle-bridge-test
          arch "-$cpu" build/sparkle-bridge-test
      - name: Extract and execute shipped package
        run: |
          source "$RUNNER_TEMP/tools/env"
          mkdir -p build/cross-smoke build/cross-evidence
          tar -xzf dist/*-${{ matrix.target }}.tar.gz -C build/cross-smoke
          root=$(find build/cross-smoke -mindepth 1 -maxdepth 1 -type d -print -quit)
          cd build/cross-evidence
          bash ../../scripts/cross-smoke.sh '${{ matrix.target }}' "../../$root"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.target }}
          path: |
            dist/*-${{ matrix.target }}.tar.gz
            dist/appcast-${{ matrix.target == 'darwin-arm64' && 'arm64' || 'amd64' }}.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: build/cross-evidence/${{ matrix.target }}.png
          if-no-files-found: error
