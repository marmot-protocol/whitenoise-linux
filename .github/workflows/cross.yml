name: Cross releases

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
    secrets:
      WN_METRICS_WRITE_TOKEN:
        required: false
      WN_AUDIT_WRITE_TOKEN:
        required: false
      JSIGN_KEYSTORE_BASE64:
        required: false
      JSIGN_KEYSTORE:
        required: false
      JSIGN_STOREPASS:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Archive version (empty uses VERSION)
        required: false
        default: ''

jobs:
  cross:
    name: Cross ${{ matrix.target }} on Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # linux-amd64 is not a cross build, but the same portable tarball
        # recipe as linux-arm64 (Ubuntu 24.04 sysroot, bundled libraries).
        target: [linux-arm64, linux-amd64, windows-amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      # The toolchain image (~1.2 GB compressed) is cached per Containerfile:
      # loading it beats reinstalling ~660 MB of packages. It also freezes the
      # image's stable Rust until the Containerfile changes.
      - name: Restore toolchain image
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/whitenoise-cross.tar
          key: cross-image-${{ hashFiles('packaging/cross/Containerfile') }}
      - name: Build Linux toolchain image
        run: |
          image="$RUNNER_TEMP/whitenoise-cross.tar"
          if [ -f "$image" ]; then
            podman load -i "$image"
          else
            podman build -f packaging/cross/Containerfile -t whitenoise-cross packaging/cross
            podman save -o "$image" whitenoise-cross
          fi
      - name: Save toolchain image
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/whitenoise-cross.tar
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
      # vcpkg's binary cache (only Windows uses vcpkg here) and the marmot-c
      # archive are keyed on their inputs and saved right after the build, so
      # a failed package or smoke step still keeps them. vcpkg hashes each
      # port's ABI itself, so an older archive set is a safe starting point.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        if: matrix.target == 'windows-amd64'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.target }}-${{ hashFiles('DEPS_PIN', 'packaging/cross/vcpkg.json', 'scripts/cross-toolchain.sh', 'scripts/cross-deps.sh') }}
          restore-keys: vcpkg-${{ matrix.target }}-
      # cross-build.sh skips cargo when libmarmot_c.stamp matches the same
      # inputs: the MDK commit and its patches, nothing else.
      - name: Read the MDK pin
        id: mdk
        run: echo "commit=$(sed -n 's/^mdk-commit = //p' DEPS_PIN)" >> "$GITHUB_OUTPUT"
      - name: Restore marmot-c
        id: marmot-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/libmarmot_c.a
            build/cross/${{ matrix.target }}/libmarmot_c.stamp
          key: marmot-${{ matrix.target }}-${{ steps.mdk.outputs.commit }}-${{ hashFiles('patches/mdk-*.patch') }}
      # MicroTeX, ufbx and (Windows) libplacebo + mpv. Each output carries a
      # stamp of its pins and patches, so the newest older entry is a safe
      # fallback: only components whose inputs changed rebuild.
      - name: Restore C dependencies
        id: cdeps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/microtex
            build/cross/${{ matrix.target }}/microtex.stamp
            build/cross/${{ matrix.target }}/fbx/ufbx.o
            build/cross/${{ matrix.target }}/fbx/ufbx.stamp
            build/cross/${{ matrix.target }}/mpv-stage
            build/cross/${{ matrix.target }}/mpv.stamp
          key: cdeps-${{ matrix.target }}-${{ hashFiles('DEPS_PIN', 'patches/microtex-*.patch', 'packaging/cross/vcpkg.json') }}
          restore-keys: cdeps-${{ matrix.target }}-
      # Tagged releases build a delta from the previous GitHub release.
      # JSIGN_STORETYPE enables optional signing; see README for credentials.
      - name: Prepare Windows signing
        if: matrix.target == 'windows-amd64' && inputs.version != ''
        env:
          JSIGN_STORETYPE: ${{ vars.JSIGN_STORETYPE }}
          JSIGN_KEYSTORE_BASE64: ${{ secrets.JSIGN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          if [ -n "$JSIGN_KEYSTORE_BASE64" ]; then
            printf '%s' "$JSIGN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/keystore"
          fi
      - name: Cross compile and package
        env:
          WN_RELEASE_VERSION: ${{ inputs.version }}
          WN_METRICS_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_METRICS_WRITE_TOKEN || '' }}
          WN_AUDIT_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_AUDIT_WRITE_TOKEN || '' }}
          RELEASE: ${{ matrix.target == 'windows-amd64' && inputs.version != '' }}
          JSIGN_STORETYPE: ${{ vars.JSIGN_STORETYPE }}
          JSIGN_ALIAS: ${{ vars.JSIGN_ALIAS }}
          JSIGN_KEYSTORE_SECRET: ${{ secrets.JSIGN_KEYSTORE }}
          JSIGN_STOREPASS: ${{ secrets.JSIGN_STOREPASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.cache/vcpkg/archives"
          args=(-e WN_RELEASE_VERSION -e WN_METRICS_WRITE_TOKEN -e WN_AUDIT_WRITE_TOKEN
            -v "$HOME/.cache/vcpkg:/root/.cache/vcpkg")
          if [ "$RELEASE" = true ]; then
            # A keystore file is mounted; a cloud keystore is a name/URL.
            keystore="$JSIGN_KEYSTORE_SECRET"
            if [ -f "$RUNNER_TEMP/signing/keystore" ]; then keystore=/signing/keystore; fi
            args+=(-v "$RUNNER_TEMP/signing:/signing:ro" -e JSIGN_STORETYPE -e JSIGN_ALIAS -e JSIGN_STOREPASS
              -e JSIGN_KEYSTORE="$keystore" -e GITHUB_TOKEN -e WN_VELOPACK_REPO="https://github.com/${{ github.repository }}")
          fi
          podman run --rm -v "$PWD:/work" "${args[@]}" whitenoise-cross '${{ matrix.target }}'
      - name: Remove generated observability credentials
        if: always()
        run: sudo rm -f build/observability-tokens.toml
      - name: Save marmot-c
        if: always() && steps.marmot-cache.outputs.cache-hit != 'true' && hashFiles(format('build/cross/{0}/libmarmot_c.stamp', matrix.target)) != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/libmarmot_c.a
            build/cross/${{ matrix.target }}/libmarmot_c.stamp
          key: ${{ steps.marmot-cache.outputs.cache-primary-key }}
      - name: Save vcpkg binary cache
        if: always() && matrix.target == 'windows-amd64' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Save C dependencies
        if: always() && steps.cdeps-cache.outputs.cache-hit != 'true' && hashFiles(format('build/cross/{0}/microtex.stamp', matrix.target)) != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/microtex
            build/cross/${{ matrix.target }}/microtex.stamp
            build/cross/${{ matrix.target }}/fbx/ufbx.o
            build/cross/${{ matrix.target }}/fbx/ufbx.stamp
            build/cross/${{ matrix.target }}/mpv-stage
            build/cross/${{ matrix.target }}/mpv.stamp
          key: ${{ steps.cdeps-cache.outputs.cache-primary-key }}
      - name: Remove signing material
        if: always() && matrix.target == 'windows-amd64'
        run: rm -rf "$RUNNER_TEMP/signing"
      - name: Extract and execute shipped package
        run: |
          mkdir -p build/cross-smoke/package build/cross-evidence
          if [ '${{ matrix.target }}' = windows-amd64 ]; then
            # Velopack's portable zip has no top directory; a staging zip does.
            if [ -f dist/WhiteNoise-win-Portable.zip ]; then
              unzip -q dist/WhiteNoise-win-Portable.zip -d build/cross-smoke/package
            else
              unzip -q dist/*-windows-amd64.zip -d build/cross-smoke
            fi
          else
            tar -xzf dist/*-${{ matrix.target }}.tar.gz -C build/cross-smoke
          fi
          root=build/cross-smoke/package
          if [ ! -e "$root/current" ]; then
            root=$(find build/cross-smoke -mindepth 1 -maxdepth 1 -type d ! -name package -print -quit)
          fi
          mounts=(-v "$PWD/$root:/release:ro" -v "$PWD/scripts/cross-smoke.sh:/cross-smoke.sh:ro")
          mounts+=(-v "$PWD/build/cross-evidence:/evidence")
          args=('${{ matrix.target }}' /release)
          if [ '${{ matrix.target }}' = linux-arm64 ]; then
            mounts+=(-v "$PWD/build/cross/linux-arm64/sysroot:/target-sysroot:ro")
            args+=(/target-sysroot)
          fi
          podman run --rm --init --workdir /evidence --entrypoint bash "${mounts[@]}" whitenoise-cross \
            /cross-smoke.sh "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.target }}
          path: |
            dist/*-${{ matrix.target }}.*
            dist/WhiteNoise-win-*
            dist/*.nupkg
            dist/*.win.json
            dist/RELEASES
          if-no-files-found: error
      # Visual proof of the headless boot, kept apart from the release files.
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: build/cross-evidence/${{ matrix.target }}.png
          if-no-files-found: error

  # No hosted OpenBSD runner: boot the OpenBSD 7.9 image under QEMU on Linux
  # and build natively inside it (scripts/openbsd-build.sh). The workspace
  # syncs into the VM and back, so the host restores and saves the caches.
  openbsd:
    name: Build openbsd-amd64 in a VM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Sources first: build.sh clones vendor/mdk only when the directory is
      # missing, and restoring the bundle below would create it.
      - name: Fetch sources
        id: sources
        run: |
          scripts/build.sh sources
          echo "mdk=$(sed -n 's/^mdk-commit = //p' DEPS_PIN)" >> "$GITHUB_OUTPUT"
      - name: Restore the marmot-c bundle
        id: marmot-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/mdk/crates/marmot-c/output
          key: marmot-openbsd-amd64-${{ steps.sources.outputs.mdk }}-${{ hashFiles('patches/mdk-*.patch') }}
      - name: Build and package in OpenBSD
        uses: cross-platform-actions/action@v1.6.0
        env:
          WN_RELEASE_VERSION: ${{ inputs.version }}
          WN_METRICS_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_METRICS_WRITE_TOKEN || '' }}
          WN_AUDIT_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_AUDIT_WRITE_TOKEN || '' }}
        with:
          operating_system: openbsd
          version: '7.9'
          architecture: x86-64
          cpu_count: 4
          memory: 12G
          environment_variables: WN_RELEASE_VERSION WN_METRICS_WRITE_TOKEN WN_AUDIT_WRITE_TOKEN
          run: |
            trap 'rm -f build/observability-tokens.toml' EXIT
            sudo pkg_add -I bash git cmake ninja gmake coreutils llvm%21 rust unzip-- \
              sdl3 libarchive libwebp mpv poppler cairo curl glib2 ffmpeg zenity libnotify
            # The image's root filesystem has ~4 GB left after the packages,
            # short of cargo's ~2.3 GB plus the workspace. Build Rust on a
            # swap-backed memory filesystem; root's class caps data at 4 GB.
            sudo sh -c 'ulimit -d unlimited && mkdir -p /mnt/scratch && mount_mfs -s 8g swap /mnt/scratch && chown runner /mnt/scratch'
            export CARGO_TARGET_DIR=/mnt/scratch/target CARGO_HOME=/mnt/scratch/cargo
            bash scripts/openbsd-build.sh
            # Keep the sync back small.
            rm -rf build/openbsd/odin
      - name: Remove generated observability credentials
        if: always()
        run: rm -f build/observability-tokens.toml
      - name: Save the marmot-c bundle
        if: always() && steps.marmot-cache.outputs.cache-hit != 'true' && hashFiles('vendor/mdk/crates/marmot-c/output/.mdk-patches') != ''
        uses: actions/cache/save@v4
        with:
          path: vendor/mdk/crates/marmot-c/output
          key: ${{ steps.marmot-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: cross-openbsd-amd64
          path: dist/*-openbsd-amd64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-openbsd-amd64
          path: build/openbsd/wn-odin-shot.png
          if-no-files-found: error

  # Apple's SDK is licensed for Apple hardware, so macOS packages build on a
  # Mac. One Apple silicon runner builds both architectures; the Intel bundle
  # is smoke-tested under Rosetta. ponytail: GitHub-hosted until the
  # self-hosted Mac mini runs these same scripts under ngit act.
  macos:
    name: Build ${{ matrix.target }} on macOS
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned build tools
        run: scripts/macos-setup.sh "$RUNNER_TEMP/tools"
      # vcpkg's binary cache and the marmot-c archive, as in the Linux job:
      # keyed on their inputs and saved right after the build.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.target }}-${{ hashFiles('DEPS_PIN', 'packaging/cross/vcpkg.json', 'scripts/cross-toolchain.sh', 'scripts/cross-deps.sh') }}
          restore-keys: vcpkg-${{ matrix.target }}-
      - name: Read the MDK pin
        id: mdk
        run: echo "commit=$(sed -n 's/^mdk-commit = //p' DEPS_PIN)" >> "$GITHUB_OUTPUT"
      - name: Restore marmot-c
        id: marmot-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/libmarmot_c.a
            build/cross/${{ matrix.target }}/libmarmot_c.stamp
          key: marmot-${{ matrix.target }}-${{ steps.mdk.outputs.commit }}-${{ hashFiles('patches/mdk-*.patch') }}
      - name: Restore C dependencies
        id: cdeps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/microtex
            build/cross/${{ matrix.target }}/microtex.stamp
            build/cross/${{ matrix.target }}/fbx/ufbx.o
            build/cross/${{ matrix.target }}/fbx/ufbx.stamp
            build/cross/${{ matrix.target }}/mpv-stage
            build/cross/${{ matrix.target }}/mpv.stamp
          key: cdeps-${{ matrix.target }}-${{ hashFiles('DEPS_PIN', 'patches/microtex-*.patch', 'packaging/cross/vcpkg.json') }}
          restore-keys: cdeps-${{ matrix.target }}-
      - name: Build and package
        env:
          WN_RELEASE_VERSION: ${{ inputs.version }}
          WN_METRICS_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_METRICS_WRITE_TOKEN || '' }}
          WN_AUDIT_WRITE_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.WN_AUDIT_WRITE_TOKEN || '' }}
        run: |
          source "$RUNNER_TEMP/tools/env"
          bash scripts/cross-build.sh '${{ matrix.target }}'
      - name: Remove generated observability credentials
        if: always()
        run: rm -f build/observability-tokens.toml
      - name: Save marmot-c
        if: always() && steps.marmot-cache.outputs.cache-hit != 'true' && hashFiles(format('build/cross/{0}/libmarmot_c.stamp', matrix.target)) != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/libmarmot_c.a
            build/cross/${{ matrix.target }}/libmarmot_c.stamp
          key: ${{ steps.marmot-cache.outputs.cache-primary-key }}
      - name: Save C dependencies
        if: always() && steps.cdeps-cache.outputs.cache-hit != 'true' && hashFiles(format('build/cross/{0}/microtex.stamp', matrix.target)) != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/cross/${{ matrix.target }}/microtex
            build/cross/${{ matrix.target }}/microtex.stamp
            build/cross/${{ matrix.target }}/fbx/ufbx.o
            build/cross/${{ matrix.target }}/fbx/ufbx.stamp
            build/cross/${{ matrix.target }}/mpv-stage
            build/cross/${{ matrix.target }}/mpv.stamp
          key: ${{ steps.cdeps-cache.outputs.cache-primary-key }}
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      # Apple clang has crashed (SIGABRT) on harfbuzz here. Keep its crash
      # report and preprocessed reproducer, which otherwise die with the runner.
      - name: Collect compiler crash reports
        if: failure()
        run: |
          mkdir -p build/clang-crash
          find ~/Library/Logs/DiagnosticReports -name 'clang*' -exec cp {} build/clang-crash/ \;
          find "${TMPDIR:-/tmp}" -maxdepth 1 \( -name '*.sh' -o -name '*.cpp' -o -name '*.c' \) -newer "$GITHUB_WORKSPACE/DEPS_PIN" \
            -exec cp {} build/clang-crash/ \;
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: clang-crash-${{ matrix.target }}
          path: build/clang-crash/
          if-no-files-found: ignore
      - name: Extract and execute shipped package
        run: |
          source "$RUNNER_TEMP/tools/env"
          mkdir -p build/cross-smoke build/cross-evidence
          tar -xzf dist/*-${{ matrix.target }}.tar.gz -C build/cross-smoke
          root=$(find build/cross-smoke -mindepth 1 -maxdepth 1 -type d -print -quit)
          cd build/cross-evidence
          bash ../../scripts/cross-smoke.sh '${{ matrix.target }}' "../../$root"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: build/cross-evidence/${{ matrix.target }}.png
          if-no-files-found: error
