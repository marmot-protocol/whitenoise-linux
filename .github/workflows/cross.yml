name: Linux-hosted cross releases

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Archive version (empty uses VERSION)
        required: false
        default: ''

jobs:
  cross:
    name: Cross ${{ matrix.target }} on Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-arm64, windows-amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build Linux toolchain image
        run: podman build -f packaging/cross/Containerfile -t whitenoise-cross packaging/cross
      # Tagged releases (a version input) sign Windows binaries and build a
      # delta from the previous GitHub release. JSIGN_STORETYPE, JSIGN_ALIAS
      # (variables) and JSIGN_STOREPASS plus JSIGN_KEYSTORE or
      # JSIGN_KEYSTORE_BASE64 (secrets) configure jsign; see README.
      - name: Prepare Windows signing
        if: matrix.target == 'windows-amd64' && inputs.version != ''
        env:
          JSIGN_STORETYPE: ${{ vars.JSIGN_STORETYPE }}
          JSIGN_KEYSTORE_BASE64: ${{ secrets.JSIGN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${JSIGN_STORETYPE:?Configure the JSIGN_* signing settings before tagging a release}"
          mkdir -p "$RUNNER_TEMP/signing"
          if [ -n "$JSIGN_KEYSTORE_BASE64" ]; then
            printf '%s' "$JSIGN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/keystore"
          fi
      - name: Cross compile and package
        env:
          WN_RELEASE_VERSION: ${{ inputs.version }}
          RELEASE: ${{ matrix.target == 'windows-amd64' && inputs.version != '' }}
          JSIGN_STORETYPE: ${{ vars.JSIGN_STORETYPE }}
          JSIGN_ALIAS: ${{ vars.JSIGN_ALIAS }}
          JSIGN_KEYSTORE_SECRET: ${{ secrets.JSIGN_KEYSTORE }}
          JSIGN_STOREPASS: ${{ secrets.JSIGN_STOREPASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(-e WN_RELEASE_VERSION)
          if [ "$RELEASE" = true ]; then
            # A keystore file is mounted; a cloud keystore is a name/URL.
            keystore="$JSIGN_KEYSTORE_SECRET"
            if [ -f "$RUNNER_TEMP/signing/keystore" ]; then keystore=/signing/keystore; fi
            args+=(-v "$RUNNER_TEMP/signing:/signing:ro" -e JSIGN_STORETYPE -e JSIGN_ALIAS -e JSIGN_STOREPASS
              -e JSIGN_KEYSTORE="$keystore" -e GITHUB_TOKEN -e WN_VELOPACK_REPO="https://github.com/${{ github.repository }}")
          fi
          podman run --rm -v "$PWD:/work" "${args[@]}" whitenoise-cross '${{ matrix.target }}'
      - name: Remove signing material
        if: always() && matrix.target == 'windows-amd64'
        run: rm -rf "$RUNNER_TEMP/signing"
      - name: Extract and execute shipped package
        run: |
          mkdir -p build/cross-smoke/package build/cross-evidence
          if [ '${{ matrix.target }}' = windows-amd64 ]; then
            # Velopack's portable zip has no top directory; a staging zip does.
            if [ -f dist/WhiteNoise-win-Portable.zip ]; then
              unzip -q dist/WhiteNoise-win-Portable.zip -d build/cross-smoke/package
            else
              unzip -q dist/*-windows-amd64.zip -d build/cross-smoke
            fi
          else
            tar -xzf dist/*-linux-arm64.tar.gz -C build/cross-smoke
          fi
          root=build/cross-smoke/package
          if [ ! -e "$root/current" ]; then
            root=$(find build/cross-smoke -mindepth 1 -maxdepth 1 -type d ! -name package -print -quit)
          fi
          mounts=(-v "$PWD/$root:/release:ro" -v "$PWD/scripts/cross-smoke.sh:/cross-smoke.sh:ro")
          mounts+=(-v "$PWD/build/cross-evidence:/evidence")
          args=('${{ matrix.target }}' /release)
          if [ '${{ matrix.target }}' = linux-arm64 ]; then
            mounts+=(-v "$PWD/build/cross/linux-arm64/sysroot:/target-sysroot:ro")
            args+=(/target-sysroot)
          fi
          podman run --rm --init --workdir /evidence --entrypoint bash "${mounts[@]}" whitenoise-cross \
            /cross-smoke.sh "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.target }}
          path: |
            dist/*-${{ matrix.target }}.*
            dist/WhiteNoise-win-*
            dist/*.nupkg
            dist/*.win.json
            dist/RELEASES
          if-no-files-found: error
      # Visual proof of the headless boot, kept apart from the release files.
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: build/cross-evidence/${{ matrix.target }}.png
          if-no-files-found: error

  macos:
    name: Cross ${{ matrix.target }} on Linux (private SDK)
    # SDK access is opt-in and unavailable to untrusted fork pull requests.
    # Skipping these jobs does not prevent Linux/Windows publication.
    if: vars.WN_ENABLE_MACOS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-amd64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Fetch operator-provided private Apple SDK
        env:
          MACOS_SDK_URL: ${{ secrets.MACOS_SDK_URL }}
          MACOS_SDK_SHA256: ${{ secrets.MACOS_SDK_SHA256 }}
          MACOS_SDK_FILENAME: ${{ vars.MACOS_SDK_FILENAME }}
        run: |
          set -euo pipefail
          : "${MACOS_SDK_URL:?Configure private SDK URL secret}"
          : "${MACOS_SDK_SHA256:?Configure SDK digest secret}"
          case "$MACOS_SDK_FILENAME" in MacOSX*.sdk.tar.xz|MacOSX*.sdk.tar.gz) ;; *) echo 'Set MACOS_SDK_FILENAME to the SDK archive basename' >&2; exit 1;; esac
          case "$MACOS_SDK_FILENAME" in */*) exit 1;; esac
          mkdir -p "$RUNNER_TEMP/macos-sdk"
          curl --fail --location --proto '=https' --tlsv1.2 "$MACOS_SDK_URL" \
            -o "$RUNNER_TEMP/macos-sdk/$MACOS_SDK_FILENAME"
          printf '%s  %s\n' "$MACOS_SDK_SHA256" "$RUNNER_TEMP/macos-sdk/$MACOS_SDK_FILENAME" | sha256sum -c
      - name: Build Linux toolchain image
        run: podman build -f packaging/cross/Containerfile -t whitenoise-cross packaging/cross
      - name: Cross compile and package macOS
        env:
          MACOS_SDK_SHA256: ${{ secrets.MACOS_SDK_SHA256 }}
          MACOS_SDK_FILENAME: ${{ vars.MACOS_SDK_FILENAME }}
          WN_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          podman run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/macos-sdk:/run/macos-sdk:ro" \
            -e MACOS_SDK_ARCHIVE="/run/macos-sdk/$MACOS_SDK_FILENAME" \
            -e MACOS_SDK_SHA256 -e WN_RELEASE_VERSION whitenoise-cross '${{ matrix.target }}'
      - name: Record runtime verification limitation
        run: echo 'Mach-O dependency closure and ad-hoc signing checked on Linux; macOS runtime smoke requires an external macOS machine.'
      - uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Remove private SDK download
        if: always()
        run: rm -rf "$RUNNER_TEMP/macos-sdk"
