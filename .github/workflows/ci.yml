# CI: runs on every push to master and every PR. Just the release build
# (compiled Slint UI, no live-reload) of every target platform via the
# reusable build workflow — the same build release.yml ships, minus packaging,
# so a broken compiled UI fails CI instead of only surfacing at tag time.
#
# The quality gates (fmt, clippy, catalogs, file caps, slint formatting) are
# NOT here: they run via pr-precommit.yml, the byte-identical GitHub mirror of
# the canonical ngit-ci gate at .ngit/act/workflows/pr-precommit.yml (synced
# by .githooks/pre-commit). That workflow only fires on PRs; direct pushes to
# master are gated by the same hook running locally at commit time.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a branch/PR cancels the in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    uses: ./.github/workflows/_build.yml
    with:
      # Release-profile compiled UI, but no packaging/upload on PRs.
      release: true
      package: false
