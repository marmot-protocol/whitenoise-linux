# Build tests and package smokes. Catalog gates stay in pr-precommit.yml.
name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('wn-pr-{0}', github.ref)
    || (github.repository == 'marmot-protocol/whitenoise-linux' && github.ref == 'refs/heads/master' && 'wn-canary')
    || format('ci-skipped-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 6
  WN_BUILD_JOBS: 6
  CMAKE_BUILD_PARALLEL_LEVEL: 6
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  pr-gate:
    name: Classify PR head
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
    steps:
      - uses: actions/checkout@v4
        id: policy
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check base-owned signature policy
        id: classify
        env:
          POLICY_CHECKOUT: ${{ steps.policy.outcome }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$POLICY_CHECKOUT" != success ] || [ ! -f scripts/pr-gate.sh ] ||
             [ ! -f packaging/ci/team-signers.asc ] || ! git fetch --no-tags origin "$PR_HEAD"; then
            echo 'lane=build' >> "$GITHUB_OUTPUT"
          else
            bash scripts/pr-gate.sh "$PR_BASE" "$PR_HEAD"
          fi

  canary:
    name: Select Canary batch
    if: github.event_name != 'pull_request' && github.repository == 'marmot-protocol/whitenoise-linux' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check live refs and previous runs
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/canary.sh select

  build:
    name: build + test
    needs: [pr-gate, canary]
    if: ${{ !cancelled() && (needs.pr-gate.outputs.lane == 'build' || needs.canary.outputs.build == 'true') }}
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'pull_request' && 'wn-github-pr' || 'wn-boat-build' }}
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      smoked: ${{ steps.smoke.outcome == 'success' }}
    env:
      BOAT_CI_KEY: ${{ github.event_name != 'pull_request' && secrets.BOAT_CI_KEY || '' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash scripts/ci-boat.sh run {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      # A selective rerun can reuse the original selector job's outputs.
      - name: Recheck Canary before starting Boat
        id: recheck
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/canary.sh select

      - name: Start Ubuntu build environment
        id: start
        if: github.event_name == 'pull_request' || steps.recheck.outputs.build == 'true'
        shell: bash
        run: bash scripts/ci-boat.sh start native

      # Fail a hung test before the job deadline.
      - name: Build and test
        if: steps.start.outcome == 'success'
        timeout-minutes: 60
        run: scripts/build.sh test

      - name: Name staging AppImage
        if: steps.start.outcome == 'success'
        shell: bash
        run: |
          version=$(bash scripts/version.sh)
          echo "APPIMAGE_NAME=WhiteNoise-$version-staging-${GITHUB_SHA:0:8}-x86_64.AppImage" >> "$GITHUB_ENV"

      # Staging packages must not point AppImageUpdate at the release channel.
      - name: Build staging AppImage
        if: steps.start.outcome == 'success'
        run: |
          rm -rf AppDir
          scripts/install-tree.sh AppDir/usr whitenoise
          wget -q -O linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage"
          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          echo "$LINUXDEPLOY_SHA256  linuxdeploy" | sha256sum -c -
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x linuxdeploy appimagetool
          bash scripts/bundle-appimage.sh ./linuxdeploy AppDir
          ./appimagetool AppDir "$APPIMAGE_NAME"

      - name: Run the AppImage headless
        id: smoke
        if: steps.start.outcome == 'success'
        run: |
          chmod +x "$APPIMAGE_NAME"
          SDL_VIDEODRIVER=dummy WN_SHOT=1 WN_VAULT_PW=ci-smoke ./"$APPIMAGE_NAME" "$(mktemp -d)"

      - name: Retrieve staging AppImage
        if: steps.smoke.outcome == 'success'
        shell: bash
        run: bash scripts/ci-boat.sh pull "$APPIMAGE_NAME"

      - uses: actions/upload-artifact@v4
        if: steps.smoke.outcome == 'success'
        with:
          name: whitenoise-staging-x86_64
          path: ${{ env.APPIMAGE_NAME }}
          if-no-files-found: error

      - name: Stop build environment
        if: always() && steps.start.outcome != 'skipped' && steps.start.outcome != ''
        shell: bash
        run: bash scripts/ci-boat.sh stop

  cross:
    needs: pr-gate
    if: needs.pr-gate.outputs.lane == 'build'
    uses: ./.github/workflows/cross.yml

  advance:
    name: Advance Canary
    needs: [canary, build]
    if: ${{ !cancelled() && needs.canary.outputs.build == 'true' && needs.build.result == 'success' && needs.build.outputs.smoked == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fast-forward Canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/canary.sh advance
