name: White Noise
summary: Encrypted group chat over Nostr
description: |
  White Noise is a desktop client for Marmot: MLS group messaging carried
  over Nostr relays. You get the forward secrecy and post-compromise
  security of MLS with a portable Nostr identity you own. There is no phone
  number and no central server.

  - One-to-one and group chats, end-to-end encrypted with MLS
  - Replies, reactions, edits with history, forwarding and search
  - Markdown messages with typeset math
  - Photos, video, PDFs, archives and 3D models viewed inside the app
  - Every secret kept in one password-encrypted vault
