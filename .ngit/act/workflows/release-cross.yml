# ngit-ci uploads each actions artifact to the configured Blossom servers.
# Requires Podman/user namespaces in the act worker; Apple SDK access is opt-in.
name: staging-cross

on:
  push:
    branches: [master]

jobs:
  cross:
    name: Cross ${{ matrix.target }} on Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-arm64, windows-amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build Linux toolchain image
        run: podman build -f packaging/cross/Containerfile -t whitenoise-cross packaging/cross
      - name: Cross compile and package
        env:
          WN_RELEASE_VERSION: staging-${{ github.sha }}
        run: |
          podman run --rm -v "$PWD:/work" -e WN_RELEASE_VERSION \
            whitenoise-cross '${{ matrix.target }}'
      - name: Extract and execute shipped package
        run: |
          mkdir -p build/cross-smoke build/cross-evidence
          if [ '${{ matrix.target }}' = windows-amd64 ]; then
            unzip -q dist/*-windows-amd64.zip -d build/cross-smoke
          else
            tar -xzf dist/*-linux-arm64.tar.gz -C build/cross-smoke
          fi
          root=$(find build/cross-smoke -mindepth 1 -maxdepth 1 -type d -print -quit)
          mounts=(-v "$PWD/$root:/release:ro" -v "$PWD/scripts/cross-smoke.sh:/cross-smoke.sh:ro")
          mounts+=(-v "$PWD/build/cross-evidence:/evidence")
          if [ '${{ matrix.target }}' = linux-arm64 ]; then
            mounts+=(-v "$PWD/build/cross/linux-arm64/sysroot:/target-sysroot:ro")
          fi
          podman run --rm --init --workdir /evidence --entrypoint bash "${mounts[@]}" whitenoise-cross \
            /cross-smoke.sh '${{ matrix.target }}' /release /target-sysroot
      - uses: actions/upload-artifact@v4
        with:
          name: whitenoise-staging-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}.*
          if-no-files-found: error
      # Visual proof of the headless boot, kept apart from the staging files.
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: build/cross-evidence/${{ matrix.target }}.png
          if-no-files-found: error

  macos:
    name: Cross ${{ matrix.target }} on Linux (private SDK)
    # SDK access is opt-in and unavailable to untrusted fork pull requests.
    # Skipping these jobs does not prevent Linux/Windows publication.
    if: vars.WN_ENABLE_MACOS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-amd64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Fetch operator-provided private Apple SDK
        env:
          MACOS_SDK_URL: ${{ secrets.MACOS_SDK_URL }}
          MACOS_SDK_SHA256: ${{ secrets.MACOS_SDK_SHA256 }}
          MACOS_SDK_FILENAME: ${{ vars.MACOS_SDK_FILENAME }}
        run: |
          set -euo pipefail
          : "${MACOS_SDK_URL:?Configure private SDK URL secret}"
          : "${MACOS_SDK_SHA256:?Configure SDK digest secret}"
          case "$MACOS_SDK_FILENAME" in MacOSX*.sdk.tar.xz|MacOSX*.sdk.tar.gz) ;; *) echo 'Set MACOS_SDK_FILENAME to the SDK archive basename' >&2; exit 1;; esac
          case "$MACOS_SDK_FILENAME" in */*) exit 1;; esac
          mkdir -p "$RUNNER_TEMP/macos-sdk"
          curl --fail --location --proto '=https' --tlsv1.2 "$MACOS_SDK_URL" \
            -o "$RUNNER_TEMP/macos-sdk/$MACOS_SDK_FILENAME"
          printf '%s  %s\n' "$MACOS_SDK_SHA256" "$RUNNER_TEMP/macos-sdk/$MACOS_SDK_FILENAME" | sha256sum -c
      - name: Build Linux toolchain image
        run: podman build -f packaging/cross/Containerfile -t whitenoise-cross packaging/cross
      - name: Cross compile and package macOS
        env:
          MACOS_SDK_SHA256: ${{ secrets.MACOS_SDK_SHA256 }}
          MACOS_SDK_FILENAME: ${{ vars.MACOS_SDK_FILENAME }}
          WN_RELEASE_VERSION: staging-${{ github.sha }}
        run: |
          podman run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/macos-sdk:/run/macos-sdk:ro" \
            -e MACOS_SDK_ARCHIVE="/run/macos-sdk/$MACOS_SDK_FILENAME" \
            -e MACOS_SDK_SHA256 -e WN_RELEASE_VERSION whitenoise-cross '${{ matrix.target }}'
      - name: Record runtime verification limitation
        run: echo 'Mach-O dependency closure and ad-hoc signing checked on Linux; macOS runtime smoke requires an external macOS machine.'
      - uses: actions/upload-artifact@v4
        with:
          name: whitenoise-staging-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Remove private SDK download
        if: always()
        run: rm -rf "$RUNNER_TEMP/macos-sdk"
