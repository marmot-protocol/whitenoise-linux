# Windows uses a separate workflow so each coordinator can claim a whole file.
name: staging-cross

on:
  push:
    branches: [master]

env:
  CARGO_BUILD_JOBS: 6
  WN_BUILD_JOBS: 6
  CMAKE_BUILD_PARALLEL_LEVEL: 6
  WN_RELEASE_VERSION: staging-${{ github.sha }}

jobs:
  cross:
    name: Cross linux-arm64 on Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: /var/cache/wn-ci/worktree
    steps:
      - uses: actions/checkout@v4
      - name: Restore the exact source revision and build state
        working-directory: ${{ github.workspace }}
        run: bash scripts/ngit-stage.sh
      - name: Build, package, and test ARM Linux
        env:
          WN_METRICS_WRITE_TOKEN: ${{ secrets.WN_METRICS_WRITE_TOKEN }}
          WN_AUDIT_WRITE_TOKEN: ${{ secrets.WN_AUDIT_WRITE_TOKEN }}
        run: bash scripts/ngit-cross.sh linux-arm64
      - name: Remove generated observability credentials
        if: always()
        run: rm -f build/observability-tokens.toml
      - uses: actions/upload-artifact@v4
        with:
          name: whitenoise-staging-linux-arm64
          path: /var/cache/wn-ci/worktree/dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-linux-arm64
          path: /var/cache/wn-ci/worktree/build/cross-evidence/linux-arm64.png
          if-no-files-found: error

# macOS remains on the existing GitHub macOS runner.
