# ngit-ci: staging AppImage build, published to Blossom.
#
# Fires on every push to master. Under ngit-ci a "push" is a change to the
# repo's Nostr state event (kind 30618) for a ref, which is exactly what
# happens both on a direct push to master and when a proposal (PR) is merged,
# so this one trigger covers "push to master OR PR merge".
#
# It builds the app, bundles it into a self-contained AppImage the same way
# .github/workflows/release.yml does for tags, and hands it to the runner with
# `actions/upload-artifact@v4`. When the watching coordinator has Blossom
# enabled, ngit-ci uploads that artifact to its Blossom server(s) and attaches
# the resulting Blossom URL(s) as `artifact` tags on the signed Job Result
# (kind 9841): `upload-artifact` IS "publish to Blossom" here. There is no
# forge token; optional observability write tokens come from runner secrets.
#
# The worker image contains the pinned SDK. A repository/trust-scoped mount
# preserves source checkouts, Cargo state, and content-keyed build outputs.
#
# Notes / operator dependencies:
#   * Blossom publishing requires the coordinator to be started with
#     --blossom-servers (NGIT_CI_BLOSSOM_SERVERS). Without it the build still
#     runs and passes, but no artifact is uploaded.
#   * The default per-artifact Blossom cap is 64 MiB
#     (--blossom-max-artifact-bytes). The three bundled emoji sets (about
#     30 MB at zstd -19) and libmpv's codec dependencies put the AppImage
#     within reach of it; if the artifact is skipped as oversized, the
#     operator must raise that limit.

name: staging-appimage

on:
  push:
    branches: [master]

env:
  CARGO_BUILD_JOBS: 6
  WN_BUILD_JOBS: 6
  CMAKE_BUILD_PARALLEL_LEVEL: 6
  # The AppImage tooling, pinned by tag and sha256 like everything else
  # this build fetches. Upstream's "continuous" release is mutable, so
  # these use its dated tags instead.
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  # Lets the linuxdeploy / appimagetool AppImages run inside a container that
  # has no FUSE, by self-extracting instead of mounting.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  appimage:
    name: build staging AppImage (x86_64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: /var/cache/wn-ci/worktree
    steps:
      - uses: actions/checkout@v4

      - name: Restore the exact source revision and build state
        working-directory: ${{ github.workspace }}
        run: bash scripts/ngit-stage.sh

      - name: Build and test
        env:
          WN_METRICS_WRITE_TOKEN: ${{ secrets.WN_METRICS_WRITE_TOKEN }}
          WN_AUDIT_WRITE_TOKEN: ${{ secrets.WN_AUDIT_WRITE_TOKEN }}
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key \
            'White Noise CI fixtures <ci-fixtures@whitenoise.invalid>' ed25519 sign 0
          git config --global user.signingkey ci-fixtures@whitenoise.invalid
          git config --global commit.gpgsign true
          bash scripts/build.sh test

      - name: Remove generated observability credentials
        if: always()
        run: rm -f build/observability-tokens.toml

      # usr/bin + usr/lib/whitenoise-linux + usr/share/whitenoise-linux is a
      # contract with res_dir and helper_path in app/paths.odin;
      # scripts/install-tree.sh lays it out, the same way the tagged release
      # and the Flatpak do.
      - name: Assemble AppDir
        run: |
          rm -rf AppDir
          scripts/install-tree.sh AppDir/usr whitenoise

      - name: Build AppImage
        run: |
          set -euo pipefail
          if [ ! -f linuxdeploy ]; then
            wget -q -O linuxdeploy \
              "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage"
          fi
          if [ ! -f appimagetool ]; then
            wget -q -O appimagetool \
              "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          fi
          echo "$LINUXDEPLOY_SHA256  linuxdeploy" | sha256sum -c -
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x linuxdeploy appimagetool
          export LD_LIBRARY_PATH="/usr/local/sdl3/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # --executable would copy each helper into usr/bin; --deploy-deps-only
          # bundles their libraries and points their rpath at usr/lib in place.
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/whitenoise \
            --deploy-deps-only AppDir/usr/lib/whitenoise-linux \
            --desktop-file AppDir/usr/share/applications/whitenoise.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/whitenoise.png
          # Short commit for a recognizable staging filename. act sets GITHUB_SHA.
          # No -u here, unlike the release: a staging build must not point
          # AppImageUpdate at the stable release channel.
          short="${GITHUB_SHA:-unknown}"; short="${short:0:8}"
          version="$(bash scripts/version.sh)"
          out="WhiteNoise-${version}-staging-${short}-x86_64.AppImage"
          ./appimagetool AppDir "$out"
          echo "APPIMAGE_NAME=$out" >> "$GITHUB_ENV"

      # Boots the packaged artifact with SDL's dummy video driver; WN_SHOT
      # exits after a few frames. Catches a missing bundled library or a
      # res_dir that no longer finds its data.
      - name: Run the AppImage headless
        run: |
          set -euo pipefail
          chmod +x "$APPIMAGE_NAME"
          SDL_VIDEODRIVER=dummy WN_SHOT=1 WN_VAULT_PW=ci-smoke \
            ./"$APPIMAGE_NAME" "$(mktemp -d)"

      # Handed to the runner; the coordinator uploads it to Blossom and records
      # the Blossom URL as an `artifact` tag on the signed Job Result.
      - uses: actions/upload-artifact@v4
        with:
          name: whitenoise-staging-x86_64
          path: /var/cache/wn-ci/worktree/${{ env.APPIMAGE_NAME }}
          if-no-files-found: error
