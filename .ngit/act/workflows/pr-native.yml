name: PR native

on:
  pull_request:

jobs:
  native:
    name: Linux x86_64 build and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore the exact source revision and build state
        working-directory: ${{ github.workspace }}
        run: bash scripts/ngit-stage.sh

      - name: Install LLD on workers without it
        run: |
          if ! test -x "$(clang -print-prog-name=ld.lld)"; then
            apt-get update -qq
            apt-get install -y --no-install-recommends lld
          fi

      - name: Build and test
        working-directory: /var/cache/wn-ci/worktree
        run: |
          set -o pipefail
          # ngit retains only the tail of long job logs.
          CI=true setpriv --bounding-set=-dac_override,-dac_read_search bash scripts/build.sh test 2>&1 |
            awk '
              { print; fflush() }
              /^==> Building release cdylib/ { bundle = 1 }
              bundle && duration == "" && /^[[:space:]]+Finished `release` profile / { duration = $0 }
              END { if (duration != "") print "MDK Cargo:" duration }
            '
