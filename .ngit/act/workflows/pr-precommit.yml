# ngit-ci: pre-commit gate for proposals (PRs).
#
# ngit-ci watches this repo over Nostr and runs the workflows under
# .ngit/act/workflows/ with `act` (GitHub Actions-compatible syntax, each job
# in its own Linux container). This one fires on every Nostr PR / PR update
# (kinds 1618/1619) and runs the project's own pre-commit hook against the
# proposal, so a proposal that wouldn't pass `git commit` locally is marked
# failed on gitworkshop.dev.
#
# CANONICAL COPY — ngit is the primary forge. GitHub (the secondary mirror)
# runs a byte-identical copy of this file at
# .github/workflows/pr-precommit.yml, because GitHub's workflow discovery
# cannot follow symlinks. .githooks/pre-commit refreshes that mirror from this
# file and re-stages it on drift; edit THIS file, never the mirror.
#
# Why run the actual hook (.githooks/pre-commit) instead of re-listing its
# gates: it is the single source of truth (PO/POT msgfmt validation and
# normalization). Re-implementing it here would let the two drift apart.
#
# The hook operates on staged files. An isolated empty Git index presents
# the whole proposal tree, regardless of the checkout's existing history.
# The hook's normalization
# steps (po-clean, odinfmt, clang-format) auto-fix in place and re-stage rather than
# failing; we turn any such fix into a failure with a final drift check, so
# "the hook had to change something" is treated as "not clean" — matching the
# intent that only an already-clean tree passes.
#
# This gate needs no secrets or GitHub token; tools use anonymous sources.

name: pre-commit

on:
  pull_request:

jobs:
  pre-commit:
    name: pre-commit hook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # gettext supplies the msgfmt the hook's catalog checks call.
      - name: Install system deps
        run: |
          if ! command -v msgfmt >/dev/null || ! command -v git >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gettext git
          fi

      - name: Run pre-commit hook against the proposal
        run: |
          set -euo pipefail
          hook_gitdir="$(mktemp -d)"
          trap 'rm -rf "$hook_gitdir"' EXIT
          git init -q --bare "$hook_gitdir"
          export GIT_DIR="$hook_gitdir"
          export GIT_WORK_TREE="$PWD"
          git add -A
          before="$(git write-tree)"
          bash .githooks/pre-commit
          if [ "$before" != "$(git write-tree)" ] || ! git diff --quiet; then
            echo "::error::pre-commit normalized files — the proposal is not clean." >&2
            echo "Run scripts/install-hooks.sh once, then commit; the hook will fix these locally:" >&2
            git --no-pager diff --stat "$before" >&2
            exit 1
          fi
